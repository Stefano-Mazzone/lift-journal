/* Discoverable, swipeable bottom navigation */
body{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
.nav-dock{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;gap:4px;padding:10px max(8px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));background:#111924f2;backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:10;isolation:isolate}

.nav-scroll::-webkit-scrollbar{display:none}
.nav-dock .tabs{position:static;inset:auto;background:transparent;backdrop-filter:none;border:0;padding:0;overflow:visible;display:flex;align-items:center;justify-content:center;width:max-content;min-width:100%;gap:6px;z-index:auto}
.nav-dock .tabs button{flex:0 0 auto;min-width:74px;padding:8px 10px;white-space:nowrap}
.nav-arrow{position:relative;z-index:2;display:flex;flex:0 0 47px;width:47px;height:51px;flex-direction:column;align-items:center;justify-content:center;gap:0;border:1px solid #557968;border-radius:12px;background:#263b3a;color:var(--accent);font-weight:800;box-shadow:0 0 0 1px #152c24;font-size:25px;line-height:1;touch-action:manipulation}

.nav-arrow.is-hidden{visibility:hidden;pointer-events:none}
.nav-dock.has-next::after,.nav-dock.has-prev::before{content:"";position:absolute;top:10px;bottom:calc(10px + env(safe-area-inset-bottom));width:25px;z-index:1;pointer-events:none}
.nav-dock.has-next::after{right:55px;background:linear-gradient(to right,transparent,#111924f2)}
.nav-dock.has-prev::before{left:55px;background:linear-gradient(to left,transparent,#111924f2)}
.nav-arrow.hint-bounce{animation:lj-nav-nudge 1.1s ease-in-out 2}
@keyframes lj-nav-nudge{0%,100%{transform:translateX(0)}35%{transform:translateX(-6px)}65%{transform:translateX(3px)}}
@media(prefers-reduced-motion:reduce){.nav-arrow.hint-bounce{animation:none}}

/* Lift Journal motion: short, purposeful, and never required for navigation */
@keyframes lj-page-enter{from{opacity:.25;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@keyframes lj-picker-enter{from{opacity:.4;transform:translateY(8px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes lj-press-pop{0%{transform:scale(.78)}55%{transform:scale(1.13)}100%{transform:scale(1)}}
@keyframes lj-progress-fill{from{transform:scaleX(.03)}to{transform:scaleX(1)}}
@keyframes lj-progress-celebrate{0%,100%{box-shadow:0 0 0 rgba(131,230,182,0)}45%{box-shadow:0 0 0 6px rgba(131,230,182,.15)}}
@keyframes lj-card-select{0%{box-shadow:0 0 0 0 rgba(131,230,182,.36)}100%{box-shadow:0 0 0 5px rgba(131,230,182,0)}}
@keyframes lj-toast-rise{from{opacity:0;transform:translate(-50%,12px) scale(.96)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes lj-number-pop{from{opacity:.55;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes lj-confetti{0%{opacity:0;transform:translate3d(0,0,0) scale(.7) rotate(0)}12%{opacity:1}100%{opacity:0;transform:translate3d(var(--lj-drift),var(--lj-fall),0) scale(.9) rotate(var(--lj-turn))}}
#app.lj-page-enter{animation:lj-page-enter .3s cubic-bezier(.2,.75,.3,1) both}
#app.lj-page-enter .history-status-stat strong{animation:lj-number-pop .42s ease-out both}
#app.lj-page-enter .history-status-stat:nth-child(2) strong{animation-delay:.06s}
#app.lj-page-enter .history-status-stat:nth-child(3) strong{animation-delay:.12s}
#app.lj-page-enter .progress>div,#app.lj-page-enter .calorie-progress>div{transform-origin:left center;animation:lj-progress-fill .6s cubic-bezier(.2,.85,.3,1) both}
.progress>div,.calorie-progress>div{transition:width .34s cubic-bezier(.2,.75,.25,1)}
.workout-day-picker{animation:lj-picker-enter .26s cubic-bezier(.2,.8,.3,1) both}
.calendar-cell.selected{animation:lj-card-select .36s ease-out both}
.check.lj-set-checked{animation:lj-press-pop .26s cubic-bezier(.2,.7,.3,1)}
.progress.lj-progress-complete{animation:lj-progress-celebrate .75s ease-out both}
.toast{animation:lj-toast-rise .23s ease-out both}
.btn,.tabs [data-tab],.workout-option,.weekday-toggle,.movement-choice,.exercise-picker-item{
 transition:transform .14s ease,background-color .18s ease,border-color .18s ease,box-shadow .18s ease;
 -webkit-tap-highlight-color:transparent
}
.btn:active:not(:disabled),.workout-option:active,.weekday-toggle:active,.movement-choice:active,.exercise-picker-item:active{transform:scale(.975)}
.tabs [data-tab]:active{transform:scale(.96)}
@media(hover:hover) and (pointer:fine){
 .btn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.045)}
 .workout-option:hover,.movement-choice:hover{border-color:#618d7c}
}
.lj-celebration{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:55}
.lj-celebration-piece{position:absolute;left:50%;top:32%;width:7px;height:11px;border-radius:3px;background:var(--lj-color);animation:lj-confetti .95s cubic-bezier(.2,.7,.4,1) both;animation-delay:var(--lj-delay);will-change:transform,opacity}
@media(prefers-reduced-motion:reduce){
 #app.lj-page-enter,#app.lj-page-enter .history-status-stat strong,
 #app.lj-page-enter .progress>div,#app.lj-page-enter .calorie-progress>div,
 .workout-day-picker,.calendar-cell.selected,.check.lj-set-checked,
 .progress.lj-progress-complete,.toast,.lj-celebration-piece{animation:none!important}
 .btn,.tabs [data-tab],.workout-option,.weekday-toggle,.movement-choice,.exercise-picker-item,
 .progress>div,.calorie-progress>div{transition:none!important}
 .btn:active:not(:disabled),.workout-option:active,.weekday-toggle:active,.movement-choice:active,.exercise-picker-item:active{transform:none!important}
}

function missingRepsFromProgram(s){
 const plan=cycleForSession(s),dayPlan=plan?.days?.[s.day]?.[1];
 if(!Array.isArray(dayPlan)||!Array.isArray(s.exercises))return [];
 const updates=[];
 s.exercises.forEach((ex,i)=>{
  if(!ex||ex.skipped||!Array.isArray(ex.sets))return;
  const original=String(ex.originalName||ex.name||'').trim().toLocaleLowerCase();
  const current=String(ex.name||'').trim().toLocaleLowerCase();
  const prescription=dayPlan.find(d=>d&&String(d.name||'').trim().toLocaleLowerCase()===original)||
                     dayPlan.find(d=>d&&String(d.name||'').trim().toLocaleLowerCase()===current);
  if(!prescription)return;
  const reps=prescribedReps(prescription.reps);
  if(!reps)return;
  ex.sets.forEach((set,j)=>{
   // Blank only. Keep any rep value, including an intentional 0.
   if(set&&(set.reps===null||set.reps===undefined||String(set.reps).trim()===''))
    updates.push({set,reps,exercise:ex.name,index:j+1});
  });
 });
 return updates;
}
function applyMissingReps(updates){
 for(const u of updates)u.set.reps=u.reps;
 return updates.length;
}
function fillMissingSessionReps(){

 if(!updates.length){toast('No missing reps with a saved program target');return}
 if(session.finished){
  const sample=updates[0];
  const message='Fill '+updates.length+' blank rep field'+(updates.length===1?'':'s')+
   ' from the targets saved with this workout (for example '+sample.reps+' reps for '+sample.exercise+')?\n\n'+
   'These are SUGGESTED reps, not proof of what you actually performed. Review and correct them afterward. Existing reps and all weights will stay unchanged.';
  if(!confirm(message))return;
  editingPast=true;
 }
 const filled=applyMissingReps(updates);
 save();render();toast('Filled '+filled+' blank rep field'+(filled===1?'':'s')+' · review actual reps');
}

function dailyFocusMatches(name,focus){
 const info=identifyExercise(name);
 if(focus==='upper')return info.group==='push'||info.group==='pull';
 if(focus==='lower')return info.group==='legs'||info.group==='core';
 return ['legs','push','pull','core','conditioning'].includes(info.group);
}
function dailyFavoriteNames(focus,profile){
 const names=data.favoriteMovements.filter(name=>dailyFocusMatches(name,focus)&&trainerCanUse(name,profile));
 // Choose a mixture of categories rather than filling a session with five variations of a curl.
 const categories=['legs','push','pull','core','conditioning'];
 if(focus==='upper')categories.splice(0,categories.length,'push','pull');
 if(focus==='lower')categories.splice(0,categories.length,'legs','core');
 const ordered=[],remaining=names.slice();
 for(const group of categories){
  const index=remaining.findIndex(name=>identifyExercise(name).group===group);
  if(index>=0)ordered.push(...remaining.splice(index,1));
 }
 return [...ordered,...remaining];
}

  const proposal=coachSessionSuggestion.plan;
  const exercises=proposal.days[0].exercises.filter(ex=>trainerCanUse(ex.name,profile));
  return [proposal.title,exercises.map(e=>X(e.name,e.sets,e.reps,e.rest||90))];
 }
 if(dailyChoice.mode==='plan'){
  const workout=c.days[chosen];return [workout[0],workout[1].filter(ex=>trainerCanUse(ex.name,profile))];

 const max=dailyChoice.minutes<=20?3:dailyChoice.minutes<=30?4:dailyChoice.minutes<=45?5:6;

   dailyChoice.focus==='lower'?['squat','hinge','squat','hinge','core','accessory']:
   ['squat','push','pull','hinge','core','arms'];
  for(let i=0;i<groups.length&&names.length<max;i++){
   const name=trainerChoose(groups[i],profile,i,used);
   if(name)names.push(name);

 }
 const focusName={upper:'Upper Body',lower:'Lower Body',full:'Full Body'}[dailyChoice.focus];
 const title=(dailyChoice.mode==='favorites'?'Favorites · ':'Today · ')+focusName;

function coachAISettings(){

 const endpoint=String(config.endpoint||'').trim().replace(/\/+$/,'');
 const turnstileSiteKey=String(config.turnstileSiteKey||'').trim();
 try{

  if(url.protocol!=='https:'||!turnstileSiteKey||turnstileSiteKey.length>150)return null;
  if(!/^[a-zA-Z0-9._:-]+$/.test(url.host)||url.pathname!=='/')return null;

function loadCoachVerification(){
 if(window.turnstile?.render)return Promise.resolve();
 if(coachTurnstileLoader)return coachTurnstileLoader;
 coachTurnstileLoader=new Promise((resolve,reject)=>{
  const script=document.createElement('script');
  script.async=true;script.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
  let done=false;
  const timer=setTimeout(()=>finish(Error('Verification did not load')),12000);
  const finish=error=>{
   if(done)return;done=true;clearTimeout(timer);
   if(error){script.remove();reject(error)}else resolve();
  };
  script.onload=()=>window.turnstile?.render?finish():finish(Error('Verification unavailable'));
  script.onerror=()=>finish(Error('Verification script unavailable'));
  document.head.appendChild(script);
 }).catch(e=>{coachTurnstileLoader=null;throw e});
 return coachTurnstileLoader;
}

function historyDateLabel(iso){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(String(iso)))return 'Unknown date';
 return new Date(iso+'T12:00:00').toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
}
function storedSkippedSessions(){
 const result=[];
 for(const [slot,override] of Object.entries(data.schedule||{})){
  if(!override||override.status!=='skipped')continue;
  const match=/^(\d{4}-\d{2})_(\d{4}-\d{2}-\d{2})_(\d+)$/.exec(slot);
  if(!match)continue;
  const m=match[1],index=Number(match[3]);
  const a=monthSchedule(m).find(x=>x.slot===slot);
  // Existing skip entries predate saved day/date metadata. Reconstruct their
  // original scheduled date from the week and current weekday configuration.
  const monday=new Date(match[2]+'T12:00:00');
  const weekday=Array.isArray(data.weekdays)?data.weekdays[index]:null;
  const offset=Number.isInteger(weekday)?(weekday+6)%7:0;
  monday.setDate(monday.getDate()+offset);
  const date=override.date||a?.date||isoDate(monday),day=Number.isInteger(override.day)?override.day:a?.day??index;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date))continue;
  const hasWorkout=Object.values(data.sessions).some(s=>s&&(
   s.slot===slot||(s.scheduledDate===date&&s.month===m&&s.day===day)
  ));
  if(hasWorkout)continue;
  result.push({slot,date,day,month:m,legacy:!override.date&&!a});
 }
 return result.sort((a,b)=>b.date.localeCompare(a.date)||a.day-b.day);
}

function catalogWithUserExercises(){

 const add=r=>{if(!r?.name)return;const key=r.name.toLowerCase().trim();if(!seen.has(key)){seen.add(key);items.push(r)}};
 allExerciseRecords.forEach(add);
 for(const s of Object.values(data.sessions||{}))for(const e of s.exercises||[])add({name:e.name,category:'Custom & Previous',group:'other',pattern:'other'});
 if(data.customPlan)for(const d of data.customPlan.days||[])for(const e of d[1]||[])add({name:e.name,category:'Custom & Previous',group:'other',pattern:'other'});
 return items.sort((a,b)=>a.name.localeCompare(b.name));

function identifyExercise(name){
 const normalized=String(name||'').trim().toLowerCase();
 const found=catalogWithUserExercises().find(x=>x.name.toLowerCase()===normalized);
 if(found&&found.pattern!=='other')return found;
 // Meaningful fallback for saved or personalized movement names.
 const v=normalized;
 let pattern='other',group='other',category='Other';
 if(/bicep|curl|preacher|hammer curl|zottman|concentration/.test(v)&&!/leg curl|hamstring/.test(v)){pattern='biceps';group='pull';category='Biceps & Forearms'}
 else if(/tricep|skull|pressdown|pushdown|french press/.test(v)){pattern='triceps';group='push';category='Triceps'}
 else if(/calf|tibialis/.test(v)){pattern='calf';group='legs';category='Calf & Shin'}
 else if(/leg curl|hamstring|nordic/.test(v)){pattern='legcurl';group='legs';category='Leg Curl'}
 else if(/squat|leg press|leg extension/.test(v)){pattern=/leg press|extension/.test(v)?'legpress':'squat';group='legs';category='Squat'}
 else if(/deadlift|good morning|hip thrust|glute bridge/.test(v)){pattern='hinge';group='legs';category='Deadlift & Hinge'}
 else if(/lunge|step.up|split squat/.test(v)){pattern='lunge';group='legs';category='Lunge & Step-Up'}
 else if(/pull.up|chin.up|pulldown/.test(v)){pattern='verticalpull';group='pull';category='Vertical Pull'}
 else if(/row/.test(v)){pattern='row';group='pull';category='Horizontal Row'}
 else if(/fly|crossover|pec deck/.test(v)){pattern='chestfly';group='push';category='Chest Fly'}
 else if(/bench|chest press|push.up/.test(v)){pattern='chestpress';group='push';category='Chest Press'}
 else if(/lateral raise|front raise/.test(v)){pattern='lateralraise';group='push';category='Shoulder Raise'}
 else if(/shoulder press|overhead press|military press/.test(v)){pattern='shoulderpress';group='push';category='Shoulder Press'}
 else if(/rear delt|reverse fly|face pull|shrug/.test(v)){pattern='rearDelt';group='pull';category='Rear Delts & Upper Back'}
 else if(/plank|crunch|sit.up|abs|pallof|woodchop|leg raise/.test(v)){pattern='core';group='core';category='Core'}
 return {name:String(name),category,group,pattern};
}
function movementEquipment(name){

 if(/\bdumbbell\b|\bdb\b/.test(v))return 'dumbbell';
 if(/\bcable\b|\bpulley\b|\brope\b/.test(v))return 'cable';
 if(/\bbarbell\b|\bez.bar\b|\bsafety bar\b|\bsmith\b/.test(v))return 'barbell';
 if(/machine|pec deck|leg press|leg curl|lat pulldown/.test(v))return 'machine';
 if(/bodyweight|push.up|pull.up|chin.up|plank/.test(v))return 'bodyweight';
 return 'any';
}
function exerciseAlternatives(name,limit=8,profile=data.trainerProfile){
 // With current symptoms in the original movement, do not automatically suggest
 // another lift as if it were a medically safer replacement.
 if(profile&&!trainerCanUse(name,profile))return [];
 const source=identifyExercise(name),baseEquipment=movementEquipment(name);
 const restricted=Array.isArray(profile?.limits)?profile.limits:[];
 return catalogWithUserExercises().filter(r=>r.name.toLowerCase()!==String(name).toLowerCase())
 .map(r=>{
  const identified=r.pattern==='other'?identifyExercise(r.name):r;
  const exact=source.pattern!=='other'&&identified.pattern===source.pattern;
  const sameGroup=source.group!=='other'&&identified.group===source.group;
  const sameEquipment=baseEquipment!=='any'&&movementEquipment(r.name)===baseEquipment;
  const equipmentFit=trainerEquipmentFit(r.name,profile?.equipment||'all');
  const cautions=restricted.filter(area=>trainerAreaRisk(r.name,area));
  const currentConcern=profile?.limitStatus==='current'&&cautions.length>0;
  const score=(exact?100:0)+(sameGroup?25:0)+(sameEquipment?16:0)+(equipmentFit?12:-60)+
    (source.pattern==='biceps'&&/hammer|preacher|ez.bar|incline|concentration/i.test(r.name)?10:0)-
    (cautions.length?(profile?.limitStatus==='current'?250:30):0);
  const reason=exact?(sameEquipment?'Similar Movement · Same Equipment':'Same Movement Pattern'):
   sameGroup?'Same Muscle Group':'Other Exercise';
  return {...r,score,reason,equipmentFit,cautions,currentConcern};
 })
 .filter(r=>r.score>=25&&!r.currentConcern&&r.equipmentFit&&trainerCanUse(r.name,profile||{})&&
  (source.pattern==='other'||identifyExercise(r.name).pattern===source.pattern))
 .sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name)).slice(0,limit);
}
const TRAINER_LIMIT_AREAS=[['knee','Knee'],['hip','Hip / Groin'],['ankle','Ankle / Foot'],['back','Lower Back'],['shoulder','Shoulder'],['elbow','Elbow / Wrist'],['neck','Neck']];
function trainerDefaultPrefs(){return {goal:'muscle',experience:'beginner',days:3,minutes:45,equipment:'all',painLevels:{},limits:[],limitStatus:'none',medical:'unanswered'}}

function painScore(value){const v=Number(value);return Number.isInteger(v)&&v>=0&&v<=10?v:0}
function painLevelsFor(profile){
 const output={},p=profile||{};
 for(const [id] of TRAINER_LIMIT_AREAS){
  if(p.painLevels&&typeof p.painLevels==='object'&&!Array.isArray(p.painLevels)){
   if(Object.prototype.hasOwnProperty.call(p.painLevels,id))output[id]=painScore(p.painLevels[id]);
  }else if(Array.isArray(p.limits)&&p.limits.includes(id))output[id]=p.limitStatus==='current'?4:0;
 }
 return output;
}
function painProfile(p){
 const painLevels=painLevelsFor(p),limits=Object.keys(painLevels);

}

function trainerAreaRisk(name,area){
 const v=String(name||'').toLowerCase();

const SCAN_HISTORY_MAX=30;
function historyBarcodeKey(value){
 const c=String(value||'');
 return c.length===13&&c[0]==='0'?c.slice(1):c;
}
function makeScannedRecord(food,portion,when=new Date().toISOString()){
 const code=String(food?.code||''),name=String(food?.name||'').trim().slice(0,150),grams=Number(portion??food?.portion);
 if(!/^\d{8,14}$/.test(code)||!name)return null;
 const number=v=>v==null||v===''||!Number.isFinite(Number(v))||Number(v)<0?null:Math.round(Number(v)*1000)/1000;
 return {code,name,brand:String(food.brand||'').slice(0,100),serving:String(food.serving||'').slice(0,80),
  portion:Number.isFinite(grams)&&grams>0&&grams<=10000?grams:100,
  kcal:number(food.kcal),protein:number(food.protein),carbs:number(food.carbs),
  fat:number(food.fat),sugars:number(food.sugars),fiber:number(food.fiber),when};
}
function scannedFoodHistory(){
 const nutrition=calorieInfo();
 if(Array.isArray(nutrition.scannedHistory))return nutrition.scannedHistory;
 const history=[],seen=new Set();
 for(const [date,entries] of Object.entries(nutrition.entries).sort((a,b)=>b[0].localeCompare(a[0]))){
  if(!Array.isArray(entries))continue;
  for(const entry of entries.slice().reverse()){
   const grams=Number(entry?.grams),kcal=Number(entry?.kcal),code=String(entry?.barcode||''),key=historyBarcodeKey(code);
   if(!/^\d{8,14}$/.test(code)||seen.has(key)||!Number.isFinite(grams)||grams<=0||grams>10000||!Number.isFinite(kcal)||kcal<0)continue;
   const macro=k=>entry[k]==null?null:Number(entry[k])*100/grams;
   const record=makeScannedRecord({code,name:String(entry.name||'').replace(/\s*\(\d+(?:\.\d+)?\s*g\)\s*$/i,''),
    brand:'Previously logged',kcal:kcal*100/grams,protein:macro('protein'),carbs:macro('carbs'),fat:macro('fat')},
    grams,/^\d{4}-\d{2}-\d{2}$/.test(date)?date+'T12:00:00.000Z':new Date().toISOString());
   if(!record)continue;
   history.push(record);seen.add(key);
   if(history.length>=SCAN_HISTORY_MAX)break;
  }
  if(history.length>=SCAN_HISTORY_MAX)break;
 }
 nutrition.scannedHistory=history;
 return history;
}
function rememberScannedFood(food,grams,saveNow=true){
 const item=makeScannedRecord(food,grams);
 if(!item)return false;
 const n=calorieInfo(),old=scannedFoodHistory().slice();
 n.scannedHistory=[item,...old.filter(f=>historyBarcodeKey(f?.code)!==historyBarcodeKey(item.code))].slice(0,SCAN_HISTORY_MAX);
 if(saveNow&&!save()){n.scannedHistory=old;return false}
 return true;
}
function reuseScannedFood(code){
 const item=scannedFoodHistory().find(f=>historyBarcodeKey(f?.code)===historyBarcodeKey(code));
 if(!item)return;
 scannedFood={...item};barcodeInputValue=item.code;
 barcodeMessage='Previously scanned food. Check the label and portion before logging.';

function removeScannedFood(code){

 if(!save()){n.scannedHistory=old;return}

}

function matchFood(food,query){

 if(!words.length||!words.every(t=>joined.includes(t)))return -1;
 const phrase=words.join(' ');
 return (title===phrase?1000:0)+(title.startsWith(phrase)?180:0)+(title.includes(phrase)?85:0)+words.reduce((n,w)=>n+(title.split(' ').includes(w)?12:0),0)-title.length/25;

function loadBarcodeLibrary(){

  script.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
  script.async=true;
  script.onload=()=>window.ZXing?.BrowserMultiFormatReader?resolve():reject(new Error('Barcode reader failed to initialize'));
  script.onerror=()=>reject(new Error('Barcode scanning library could not load. Check your internet connection'));

  if(file.size>20*1024*1024)throw Error('Photo exceeds 20 MB');
  await loadBarcodeLibrary();
  if(token!==barcodeScanToken||tab!=='calories')return;
  url=URL.createObjectURL(file);
  const image=new Image();
  image.src=url;
  await new Promise((resolve,reject)=>{
   if(image.complete&&image.naturalWidth){resolve();return}
   image.onload=resolve;
   image.onerror=()=>reject(Error('Could not open photo'));
  });

  reader=new Z.BrowserMultiFormatReader(new Map([[Z.DecodeHintType.POSSIBLE_FORMATS,formats]]));

   if(token!==barcodeScanToken||tab!=='calories')return;
   try{
    const crop=mode==='center',rotate=mode==='rotate';
    const width=image.naturalWidth,height=image.naturalHeight;
    const sx=crop?width*.12:0,sy=crop?height*.20:0;

   }catch(error){}
  }

function gymDistance(lat1,lon1,lat2,lon2){
 const d=Math.PI/180,a=Math.sin((lat2-lat1)*d/2)**2+Math.cos(lat1*d)*Math.cos(lat2*d)*Math.sin((lon2-lon1)*d/2)**2;

}
function parsePhotonGyms(json,lat,lon,radius){
 const result=[],seen=new Set();
 for(const feature of json?.features||[]){
  const c=feature?.geometry?.coordinates,props=feature?.properties||{};
  if(!Array.isArray(c)||c.length<2)continue;
  const a=Number(c[1]),b=Number(c[0]);
  if(!Number.isFinite(a)||!Number.isFinite(b))continue;
  const distance=gymDistance(lat,lon,a,b);
  if(distance>radius/1000)continue;
  const name=String(props.name||'').trim();
  if(!name)continue;
  const key=name.toLowerCase()+'|'+a.toFixed(4)+'|'+b.toFixed(4);
  if(seen.has(key))continue;seen.add(key);
  const address=[props.housenumber,props.street,props.city].filter(Boolean).join(', ');
  result.push({name,lat:a,lon:b,address,distance});
 }
 return result.sort((a,b)=>a.distance-b.distance).slice(0,40);
}

function gymAddressFeature(feature){

 if(!Array.isArray(coords)||coords.length<2)return null;
 const lon=Number(coords[0]),lat=Number(coords[1]);
 if(!Number.isFinite(lat)||!Number.isFinite(lon))return null;
 const street=[p.housenumber,p.street].filter(Boolean).join(' ');
 // Show business names first; keep the street, locality and postal code in the detail.
 const named=String(p.name||'').trim(),main=String(named||street||p.city||p.district||p.state||p.country||'').trim();
 if(!main)return null;
 const parts=[...(named&&street?[street]:[]),p.district,p.city,p.state,p.postcode,p.country].filter(Boolean).map(String);
 const subtitle=[...new Set(parts)].filter(s=>s.toLowerCase()!==main.toLowerCase()).join(', ');

function gymParseAddresses(json){

  const k=item.label.toLowerCase()+'|'+item.lat.toFixed(5)+'|'+item.lon.toFixed(5);

function compareAppVersions(a,b){

if(t.id==='daily-equipment'){if(['all','dumbbells','cables'].includes(t.value)){coachSessionSuggestion=null;dailyChoice.equipment=t.value;dailyCheck.confirmed=false;render()}return}if(t.id==='daily-goal'){if(['muscle','strength','general'].includes(t.value)){coachSessionSuggestion=null;dailyChoice.goal=t.value;render()}return}if(t.id==='daily-effort'){coachSessionSuggestion=null;dailyChoice.effort=t.value==='light'?'light':'normal';render();return}if(t.id==='daily-minutes'){coachSessionSuggestion=null;const n=Number(t.value);if([20,30,45,60].includes(n))dailyChoice.minutes=n;render();return}if(t.id==='exercise-picker-category'&&swapPicker){swapPicker.category=t.value;swapPicker.limit=70;refreshExercisePickerResults();return}if(t.dataset.draftSwap!==undefined){editDraftSwap(Number(t.dataset.draftSwap),t.value);return}if(t.id==='barcode-photo'||t.id==='barcode-photo-picker'){const file=t.files?.[0];if(file)scanBarcodePhoto(file);t.value='';return}if(t.id==='food-unit'){updateManualFoodHint();return}if(t.id==='gym-radius'){gymRadius=Number(t.value);render();return}if(t.id==='calorie-date'){calorieDay=t.value;render()}if(t.id==='calorie-goal'){const v=Number(t.value);if(!Number.isInteger(v)||v<1||v>20000){alert('Enter a calorie goal between 1 and 20,000.');render();return}calorieInfo().goal=v;save();render()}});document.addEventListener('input',e=>{const t=e.target;if(['food-quantity','food-kcal'].includes(t.id)){updateManualFoodHint();return}if(t.id==='exercise-picker-search'&&swapPicker){swapPicker.query=t.value;swapPicker.limit=70;refreshExercisePickerResults();return}if(draftPlan&&(t.dataset.draftField!==undefined||t.dataset.draftWorkoutName!==undefined||t.dataset.draftExname!==undefined||t.dataset.draftSets!==undefined||t.dataset.draftReps!==undefined)){draftInputChanged(t);return}if(t.id==='gym-city'){gymTyping(t.value);return}if(t.id==='portion-cups'&&scannedFood?.cup){document.getElementById('portion-grams').value=formatWeight(Number(t.value)*scannedFood.cup);portionFacts();return}if(t.id==='portion-grams'){if(scannedFood?.cup){const c=document.getElementById('portion-cups');if(c)c.value=formatWeight(Number(t.value)/scannedFood.cup)}portionFacts();return}if(t.id==='tonnage-period'){tonnagePeriod=t.value;render();return}if(t.id==='tonnage-unit'){tonnageUnit=t.value;render();return}if(t.id==='movement-search'){movementFilter=t.value;const pos=t.selectionStart;render();const field=document.getElementById('movement-search');if(field){field.focus();field.setSelectionRange(pos,pos)}return}if(t.id==='unit'){data.unit=t.value;save();return}if(t.dataset.field){const s=data.sessions[editing],v=s?.exercises[Number(t.dataset.ex)]?.sets[Number(t.dataset.set)];if(!v||(s.finished&&!editingPast))return;v[t.dataset.field]=t.dataset.field==='done'?t.checked:t.value;save();if(t.dataset.field==='done'){const active=s.exercises.filter(x=>!x.skipped),completed=active.flatMap(x=>x.sets).filter(x=>x.done).length,total=active.flatMap(x=>x.sets).length;const p=document.querySelector('.progress>div');if(p){p.style.width=(total?100*completed/total:0)+'%';if(t.checked&&total&&completed===total){p.parentElement?.classList.remove('lj-progress-complete');void p.parentElement?.offsetWidth;p.parentElement?.classList.add('lj-progress-complete')}}if(t.checked){t.classList.remove('lj-set-checked');void t.offsetWidth;t.classList.add('lj-set-checked')}else t.classList.remove('lj-set-checked')}}});

function backupRecord(v){return v&&typeof v==='object'&&!Array.isArray(v)}
function validateBackupFile(parsed){
 if(!backupRecord(parsed))throw Error('This is not a valid Lift Journal backup.');
 if(parsed.format&&parsed.format!=='lift-journal-v1')throw Error('Unrecognized backup format. No data was changed.');
 const obj=parsed.format?parsed.data:parsed;
 if(!backupRecord(obj)||!backupRecord(obj.sessions)||!['lb','kg'].includes(obj.unit))
  throw Error('Missing workout data or weight unit.');
 const sessions=Object.entries(obj.sessions);
 if(sessions.length>10000)throw Error('Backup contains too many sessions to restore safely.');
 for(const [id,s] of sessions){
  if(!backupRecord(s)||!Number.isInteger(s.day)||s.day<0||s.day>6||
     !/^\d{4}-(0[1-9]|1[0-2])$/.test(String(s.month||''))||
     typeof s.started!=='string'||Number.isNaN(Date.parse(s.started))||
     !Array.isArray(s.exercises)||s.exercises.length>100)
   throw Error('Malformed workout record: '+String(id).slice(0,40));
  if(s.unit!==undefined&&!['lb','kg'].includes(s.unit))throw Error('Unknown weight unit in workout '+String(id).slice(0,40));
  if(s.finished!=null&&(typeof s.finished!=='string'||Number.isNaN(Date.parse(s.finished))))
   throw Error('Invalid completion date in workout '+String(id).slice(0,40));
  for(const ex of s.exercises){
   if(!backupRecord(ex)||typeof ex.name!=='string'||!ex.name.trim()||!Array.isArray(ex.sets)||ex.sets.length>100)
    throw Error('Malformed exercise in workout '+String(id).slice(0,40));
   for(const set of ex.sets){
    if(!backupRecord(set)||(['string','number','undefined'].includes(typeof set.reps)===false)||
       !['string','number','undefined'].includes(typeof set.weight))
     throw Error('Malformed set values in workout '+String(id).slice(0,40));
   }
  }
  if(s.planSnapshot&&!validBackupPlan(s.planSnapshot))
   throw Error('Invalid program snapshot in workout '+String(id).slice(0,40));
 }
 if(obj.customPlan&&!validBackupPlan(obj.customPlan))throw Error('Invalid custom program.');
 if(obj.schedule!==undefined&&!backupRecord(obj.schedule))throw Error('Invalid schedule in backup.');
 if(obj.nutrition!==undefined&&(!backupRecord(obj.nutrition)||!backupRecord(obj.nutrition.entries)))
  throw Error('Invalid nutrition log in backup.');
 if(obj.nutrition?.manualFoods!==undefined){
  const items=obj.nutrition.manualFoods;
  if(!Array.isArray(items)||items.length>MANUAL_FOOD_LIMIT||items.some(item=>
   !backupRecord(item)||typeof item.name!=='string'||!item.name.trim()||item.name.length>120||
   !['g','kg','cups'].includes(item.unit)||
   !Number.isFinite(Number(item.quantity))||Number(item.quantity)<0.001||Number(item.quantity)>10000||
   !Number.isInteger(item.kcal)||item.kcal<1||item.kcal>20000))
   throw Error('Invalid saved manual food history in backup.');
 }
 if(obj.nutrition?.scannedHistory!==undefined){
  const items=obj.nutrition.scannedHistory;
  if(!Array.isArray(items)||items.length>SCAN_HISTORY_MAX||items.some(f=>
   !backupRecord(f)||!/^\d{8,14}$/.test(String(f.code||''))||
   typeof f.name!=='string'||!f.name.trim()||f.name.length>150||
   !Number.isFinite(Number(f.portion))||Number(f.portion)<=0||Number(f.portion)>10000||
   ['kcal','protein','carbs','fat','sugars','fiber'].some(k=>f[k]!=null&&(!Number.isFinite(Number(f[k]))||Number(f[k])<0))))
   throw Error('Invalid scanned food history in backup.');
 }
 return obj;
}
function validBackupPlan(plan){
 return backupRecord(plan)&&Array.isArray(plan.days)&&plan.days.length>=1&&plan.days.length<=7&&
 plan.days.every(day=>Array.isArray(day)&&typeof day[0]==='string'&&Array.isArray(day[1])&&
 day[1].every(ex=>backupRecord(ex)&&typeof ex.name==='string'&&Number.isFinite(Number(ex.sets))&&Number(ex.sets)>=1));
}
function preparedBackupData(obj){
 const weekdays=Array.isArray(obj.weekdays)&&obj.weekdays.length>=1&&obj.weekdays.length<=7&&
   new Set(obj.weekdays).size===obj.weekdays.length&&obj.weekdays.every(d=>Number.isInteger(d)&&d>=0&&d<=6)?
   obj.weekdays:[1,3,5];
 const program=backupRecord(obj.program)&&Number.isInteger(obj.program.index)&&obj.program.index>=0?obj.program:
   {index:0,number:1,started:new Date().toISOString(),history:[]};
 if(!Array.isArray(program.history))program.history=[];
 return {sessions:obj.sessions,unit:obj.unit,hasProgram:typeof obj.hasProgram==='boolean'?obj.hasProgram:true,
  weekdays,schedule:obj.schedule||{},program,customPlan:obj.customPlan||null,
  trainerProfile:obj.trainerProfile||obj.customPlan?.trainerProfile||null,
  favoriteMovements:Array.isArray(obj.favoriteMovements)?
   [...new Set(obj.favoriteMovements.filter(x=>typeof x==='string'&&x.trim()&&x.length<=90).map(x=>x.trim()))].slice(0,400):[],
  nutrition:obj.nutrition||{goal:2000,entries:{}}};
}
document.addEventListener('change',async e=>{
 if(e.target.id!=='import')return;
 const file=e.target.files?.[0];if(!file)return;
 try{
  if(file.size>20*1024*1024)throw Error('Backup is larger than the supported 20 MB maximum.');
  const contents=JSON.parse(await file.text());
  const restored=preparedBackupData(validateBackupFile(contents));
  const incomingCount=Object.keys(restored.sessions).length;
  const currentCount=Object.keys(data.sessions||{}).length;
  const notice='This backup contains '+incomingCount+' workout'+(incomingCount===1?'':'s')+
   ' and '+restored.favoriteMovements.length+' favorite movement'+(restored.favoriteMovements.length===1?'':'s')+'.\n\n'+
   'This device currently has '+currentCount+' workout'+(currentCount===1?'':'s')+'.\n\n'+
   'Importing REPLACES the existing local workouts, favorites, program and food records. It does not merge them. Export a safety backup from Settings first if you want to keep your current data.\n\nImport this backup now?';
  if(!confirm(notice))return;
  const prior=data,priorIssue=initialLoadError;
  data=restored;initialLoadError=null;
  if(!save()){data=prior;initialLoadError=priorIssue;updateStorageWarning();return}
  editing=null;selectedDate=null;selectedSlot=null;tab='history';render();
  toast('Backup restored: '+incomingCount+' workouts');
 }catch(err){alert('Cannot import backup: '+(err?.message||String(err))+'. Your saved data was not replaced.')}
 finally{e.target.value=''}
});

render();
updateStorageWarning();
initTabNavigation();
})();
