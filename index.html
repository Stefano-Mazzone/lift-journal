/* Discoverable, swipeable bottom navigation */
body{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
.nav-dock{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;gap:4px;padding:10px max(8px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));background:#111924f2;backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:10;isolation:isolate}
.nav-scroll{flex:1 1 auto;min-width:0;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;touch-action:pan-x;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.nav-scroll::-webkit-scrollbar{display:none}
.nav-dock .tabs{position:static;inset:auto;background:transparent;backdrop-filter:none;border:0;padding:0;overflow:visible;display:flex;align-items:center;justify-content:center;width:max-content;min-width:100%;gap:6px;z-index:auto}
.nav-dock .tabs button{flex:0 0 auto;min-width:74px;padding:8px 10px;white-space:nowrap}
.nav-arrow{position:relative;z-index:2;display:flex;flex:0 0 47px;width:47px;height:51px;flex-direction:column;align-items:center;justify-content:center;gap:0;border:1px solid #557968;border-radius:12px;background:#263b3a;color:var(--accent);font-weight:800;box-shadow:0 0 0 1px #152c24;font-size:25px;line-height:1;touch-action:manipulation}
.nav-arrow small{font:700 10px/1.1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.nav-arrow.is-hidden{visibility:hidden;pointer-events:none}
.nav-dock.has-next::after,.nav-dock.has-prev::before{content:"";position:absolute;top:10px;bottom:calc(10px + env(safe-area-inset-bottom));width:25px;z-index:1;pointer-events:none}
.nav-dock.has-next::after{right:55px;background:linear-gradient(to right,transparent,#111924f2)}
.nav-dock.has-prev::before{left:55px;background:linear-gradient(to left,transparent,#111924f2)}
.nav-arrow.hint-bounce{animation:lj-nav-nudge 1.1s ease-in-out 2}
@keyframes lj-nav-nudge{0%,100%{transform:translateX(0)}35%{transform:translateX(-6px)}65%{transform:translateX(3px)}}
@media(prefers-reduced-motion:reduce){.nav-arrow.hint-bounce{animation:none}}

(()=>{'use strict';

const X=(name,sets,reps,rest=90)=>({name,sets,reps,rest});
const cycles=[
{label:'Foundation',focus:'Build consistency and technique',days:[['Full Body A',[X('Pendulum Squat',3,'8–10',120),X('Dumbbell Bench Press',3,'8–12'),X('Lat Pulldown',3,'10–12'),X('Leg Curl Machine',3,'10–15'),X('Cable Triceps Pushdown',2,'12–15')]],['Full Body B',[X('Dumbbell Romanian Deadlift',3,'8–10',120),X('Seated Cable Row',3,'10–12'),X('Incline Dumbbell Press',3,'8–12'),X('Dumbbell Lateral Raise',3,'12–15'),X('Dumbbell Curl',2,'10–12')]],['Full Body C',[X('Pendulum Squat',3,'10–12',120),X('Flat Bench Press',3,'6–10',120),X('Neutral-Grip Lat Pulldown',3,'8–12'),X('Cable Face Pull',3,'12–15'),X('Standing Dumbbell Calf Raise',3,'12–20')]]]},
{label:'Strength Builder',focus:'Progress the main lifts',days:[['Strength A',[X('Flat Bench Press',4,'5–8',150),X('Pendulum Squat',3,'6–8',150),X('Seated Cable Row',3,'8–10'),X('Leg Curl Machine',3,'10–12'),X('Cable Crunch',3,'12–15')]],['Strength B',[X('Dumbbell Romanian Deadlift',4,'6–8',150),X('Lat Pulldown',4,'8–10'),X('Seated Dumbbell Shoulder Press',3,'8–10'),X('Cable Triceps Pushdown',3,'10–12'),X('Dumbbell Curl',3,'10–12')]],['Strength C',[X('Pendulum Squat',4,'6–8',150),X('Incline Dumbbell Bench Press',4,'8–10'),X('One-Arm Cable Row',3,'10–12 / side'),X('Dumbbell Lateral Raise',3,'12–15'),X('Standing Dumbbell Calf Raise',3,'12–15')]]]},
{label:'Hypertrophy Mix',focus:'More volume and exercise variety',days:[['Build A',[X('Pendulum Squat',4,'10–12',120),X('Incline Dumbbell Bench Press',3,'10–12'),X('Wide-Grip Lat Pulldown',3,'10–12'),X('Leg Curl Machine',3,'12–15'),X('Cable Lateral Raise',3,'12–15')]],['Build B',[X('Dumbbell Romanian Deadlift',3,'10–12',120),X('Close-Grip Seated Cable Row',4,'10–12'),X('Flat Dumbbell Bench Press',3,'10–12'),X('Rope Triceps Pushdown',3,'12–15'),X('Hammer Curl',3,'10–15')]],['Build C',[X('Dumbbell Split Squat',3,'10 / side',120),X('Flat Bench Press',3,'8–10'),X('Underhand Lat Pulldown',3,'10–12'),X('Cable Face Pull',3,'15–20'),X('Cable Crunch',3,'12–15')]]]},
{label:'Balanced Progress',focus:'Keep developing strength and control',days:[['Progress A',[X('Pendulum Squat',3,'8–10',120),X('Flat Dumbbell Bench Press',4,'8–10'),X('Seated Cable Row',3,'8–12'),X('Leg Curl Machine',3,'12–15'),X('Dumbbell Lateral Raise',2,'15–20')]],['Progress B',[X('Dumbbell Romanian Deadlift',3,'8–10',120),X('Neutral-Grip Lat Pulldown',4,'8–10'),X('Seated Dumbbell Shoulder Press',3,'8–12'),X('Cable Biceps Curl',3,'10–15'),X('Rope Triceps Pushdown',3,'10–15')]],['Progress C',[X('Dumbbell Reverse Lunge',3,'10 / side',120),X('Incline Dumbbell Bench Press',3,'8–12'),X('One-Arm Dumbbell Row',3,'10 / side'),X('Cable Face Pull',3,'12–20'),X('Standing Dumbbell Calf Raise',3,'15–20')]]]}];
const today=new Date(),initialMonth=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0');
const blank=()=>({sessions:{},unit:'lb',weekdays:[1,3,5],schedule:{},program:{index:0,number:1,started:new Date().toISOString(),history:[]}});let data;try{data=JSON.parse(localStorage.getItem(KEY))||blank();if(!data.sessions||!['kg','lb'].includes(data.unit))throw 0}catch{data=blank()}
if(!Array.isArray(data.weekdays)||!data.weekdays.length||data.weekdays.length>7||new Set(data.weekdays).size!==data.weekdays.length||data.weekdays.some(d=>!Number.isInteger(d)||d<0||d>6))data.weekdays=[1,3,5];if(!data.schedule||typeof data.schedule!=='object')data.schedule={};if(!data.program||!Number.isInteger(data.program.index)){data.program={index:0,number:1,started:new Date().toISOString(),history:[]};}if(!Array.isArray(data.program.history))data.program.history=[];if(data.customPlan&&!Array.isArray(data.customPlan.days))data.customPlan=null;let month=initialMonth,tab='home',day=0,editing=null,selectedSlot=null,selectedDate=null,editingPast=false,builderVisible=false,draftPlan=null,draftExpanded=0;const el=document.getElementById('app');
function save(){localStorage.setItem(KEY,JSON.stringify(data))}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cycleFor(m){return data.customPlan||cycles[data.program.index%cycles.length]}
function cycleForSession(s){if(s.planSnapshot)return s.planSnapshot;if(Number.isInteger(s.cycleIndex))return cycles[s.cycleIndex%cycles.length];const [y,mo]=s.month.split('-').map(Number);return cycles[(y*12+mo-1)%cycles.length]}
function startNextProgram(){if(Object.values(data.sessions).some(s=>!s.finished)&&!confirm('You have an unfinished workout. Continue anyway? It will remain in your history.'))return;if(!confirm('Start the next program? Your current program will be archived, and all recorded workouts will stay in your history.'))return;const old=data.program;old.history.push({number:old.number,index:old.index,started:old.started,ended:new Date().toISOString()});data.customPlan=null;old.number+=1;old.index=(old.index+1)%cycles.length;old.started=new Date().toISOString();month=initialMonth;data.schedule={};selectedSlot=null;selectedDate=null;day=0;editing=null;draftPlan=null;builderVisible=false;save();tab='home';render();toast('New program started')}
function labelMonth(m){let [y,mo]=m.split('-').map(Number);return names[mo-1]+' '+y}function shiftMonth(d){let [y,mo]=month.split('-').map(Number);const x=new Date(y,mo-1+d,1);month=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');editing=null;render()}
function isoDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function getSessions(m=month){return Object.entries(data.sessions).filter(([k,v])=>v.month===m).map(([key,v])=>({...v,key})).sort((a,b)=>b.started.localeCompare(a.started))}
function planned(){return cycleFor(month).days[day]}

function loggedNumber(v){if(v===null||v===undefined||String(v).trim()==='')return null;const n=Number(v);return Number.isFinite(n)&&n>=0?n:null}
function pastExercise(name,before){
 const ss=Object.values(data.sessions).filter(s=>s&&s.finished&&(!before||s.finished<=before)).sort((a,b)=>String(b.finished).localeCompare(String(a.finished)));
 for(const s of ss){const e=(Array.isArray(s.exercises)?s.exercises:[]).find(x=>x.name===name);if(!e||!Array.isArray(e.sets))continue;
 const sets=e.skipped?[]:e.sets.map((v,i)=>({index:i+1,weight:loggedNumber(v.weight),reps:loggedNumber(v.reps),done:!!v.done})).filter(v=>v.done&&v.weight!==null&&v.reps!==null&&v.reps>0);
 if(sets.length)return {sets,date:s.finished,unit:s.unit||data.unit,legacyUnit:!s.unit};}

}
function repGoal(reps){const nums=String(reps).match(/\d+/g);if(!nums)return null;const min=Number(nums[0]),max=nums.length>1&&/[–-]/.test(String(reps))?Number(nums[1]):min;return {min,max}}
function formatWeight(n){return Number(n).toLocaleString(undefined,{maximumFractionDigits:2})}
function adviceFor(ex,last){
 if(!last)return {kind:'unknown',title:'No previous weights yet',details:'Log and complete a workout to get a comparison next time.'};
 if(last.unit!==data.unit)return {kind:'unknown',title:'Check your weight units',details:'Your last session used '+last.unit+', but Settings currently shows '+data.unit+'. Units are not automatically converted, so no increase is suggested.'};
 const goal=repGoal(ex.reps);if(!goal)return {kind:'unknown',title:'Review your last workout',details:'There is no clear rep target for this exercise.'};
 if(last.sets.length<ex.sets)return {kind:'hold',title:'Build a complete baseline',details:'Last time, only '+last.sets.length+' of '+ex.sets+' prescribed sets had checked reps and weights. Complete all sets before increasing.'};
 const working=last.sets.slice(0,ex.sets);
 if(working.some(v=>v.reps<goal.min))return {kind:'caution',title:'Build reps first',details:'At least one set was below '+goal.min+' reps. Keep or reduce weight as needed to hit the range with good form.'};
 if(working.some(v=>v.reps<goal.max))return {kind:'hold',title:'Keep the weight for now',details:'Aim for '+goal.max+' reps on all '+ex.sets+' sets with good form before increasing.'};
 const w=working[0].weight;
 if(w<=0||working.some(v=>Math.abs(v.weight-w)>0.00001))return {kind:'hold',title:'Repeat and standardize',details:'Your completed sets used different weights (or zero added weight). Build consistent sets before increasing.'};
 return {kind:'increase',title:'Small increase may be appropriate',details:'You reached at least '+goal.max+' reps on all '+ex.sets+' sets at '+formatWeight(w)+' '+last.unit+'. If your form was controlled and you had 1–3 reps in reserve, try roughly 2.5–5% more next time if available.'};
}

function previousPreview(ex){
 const last=pastExercise(ex.name),tip=adviceFor(ex,last);
 if(!last)return '<div class="prev-preview">No previous workout logged</div>';

 return '<div class="prev-preview">Last: '+esc(lastSetText(last))+' <b>· '+esc(label)+'</b></div>';
}

function prescribedReps(reps){const target=repGoal(reps);return target&&target.min>0?String(target.min):''}
function sessionForScheduledDay(a,sessions=getSessions(a.date.slice(0,7))){
 return sessions.find(s=>s.slot===a.slot)||
 sessions.find(s=>s.day===a.day&&(s.scheduledDate===a.date||(!s.slot&&s.started&&isoDate(new Date(s.started))===a.date)))||null;
}
function scheduledWorkoutDate(s){
 if(s.scheduledDate&&/^\d{4}-\d{2}-\d{2}$/.test(s.scheduledDate))return s.scheduledDate;
 if(s.slot){const a=monthSchedule(s.month).find(x=>x.slot===s.slot);if(a)return a.date}

}
function workoutChartDate(s){return scheduledWorkoutDate(s)+'T12:00:00'}

function validWorkoutDate(chosen){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(String(chosen||'')))return false;

}

function moveRecordedWorkout(id,chosen){

 if(!validWorkoutDate(chosen)){alert('Choose a valid calendar date.');return false}

 if(previous===chosen){workoutDateEditId=null;render();return true}

 if(occupied.length&&!confirm('Another workout is recorded on '+historyDateLabel(chosen)+'. Move this workout there too? Each workout will remain separate.'))return false;
 // Do not allow a date change to reinterpret a legacy workout using a new plan.
 if(!s.planSnapshot){try{s.planSnapshot=JSON.parse(JSON.stringify(cycleForSession(s)))}catch(e){}}
 const oldSlot=s.slot||monthSchedule(oldMonth).find(a=>a.date===previous&&a.day===s.day)?.slot;
 if(oldSlot)data.schedule[oldSlot]={...(data.schedule[oldSlot]||{}),status:'relocated'};
 const newMonth=chosen.slice(0,7);
 const target=monthSchedule(newMonth).find(a=>a.date===chosen&&a.day===s.day&&a.status!=='skipped'&&
  !Object.entries(data.sessions).some(([key,other])=>key!==id&&other&&other.slot===a.slot));

 save();workoutDateEditId=null;historyDateEditId=null;
 if(tab==='home'||tab==='train'){
  month=newMonth;selectedDate=chosen;selectedSlot=target?.slot||null;

function missingRepsFromProgram(s){
 const plan=cycleForSession(s),dayPlan=plan?.days?.[s.day]?.[1];
 if(!Array.isArray(dayPlan)||!Array.isArray(s.exercises))return [];
 const updates=[];
 s.exercises.forEach((ex,i)=>{
  if(!ex||ex.skipped||!Array.isArray(ex.sets))return;
  const original=String(ex.originalName||ex.name||'').trim().toLocaleLowerCase();
  const current=String(ex.name||'').trim().toLocaleLowerCase();
  const prescription=dayPlan.find(d=>d&&String(d.name||'').trim().toLocaleLowerCase()===original)||
                     dayPlan.find(d=>d&&String(d.name||'').trim().toLocaleLowerCase()===current);
  if(!prescription)return;
  const reps=prescribedReps(prescription.reps);
  if(!reps)return;
  ex.sets.forEach((set,j)=>{
   // Blank only. Keep any rep value, including an intentional 0.
   if(set&&(set.reps===null||set.reps===undefined||String(set.reps).trim()===''))
    updates.push({set,reps,exercise:ex.name,index:j+1});
  });
 });
 return updates;
}
function applyMissingReps(updates){
 for(const u of updates)u.set.reps=u.reps;
 return updates.length;
}
function fillMissingSessionReps(){
 const session=data.sessions[editing];
 if(!session)return;
 const updates=missingRepsFromProgram(session);
 if(!updates.length){toast('No missing reps with a saved program target');return}
 if(session.finished){
  const sample=updates[0];
  const message='Fill '+updates.length+' blank rep field'+(updates.length===1?'':'s')+
   ' from the targets saved with this workout (for example '+sample.reps+' reps for '+sample.exercise+')?\n\n'+
   'These are SUGGESTED reps, not proof of what you actually performed. Review and correct them afterward. Existing reps and all weights will stay unchanged.';
  if(!confirm(message))return;
  editingPast=true;
 }
 const filled=applyMissingReps(updates);
 save();render();toast('Filled '+filled+' blank rep field'+(filled===1?'':'s')+' · review actual reps');
}
function openWorkout(id,edit=false){
 const session=data.sessions[id];if(!session)return;
 // Previously started workouts gain their saved program targets when resumed.
 // Completed sessions are never changed without a separate user action.
 if(!session.finished){
  const filled=applyMissingReps(missingRepsFromProgram(session));
  if(filled)save();
 }
 editing=id;editingPast=!!(edit&&session.finished);tab='train';selectedSlot=null;
 render();scrollTo(0,0);
}

function newSession(){

 const already=Object.entries(data.sessions).find(([id,s])=>s&&scheduledWorkoutDate(s)===workoutDate);
 if(already){openWorkout(already[0]);toast('There is already a workout saved for this date.');return}
 const cycle=cycleFor(month),workoutDay=Number.isInteger(day)&&day>=0&&day<cycle.days.length?day:0;
 const workout=cycle.days[workoutDay],id=Date.now()+'-'+Math.random().toString(36).slice(2,7);
 if(scheduled){data.schedule[scheduled.slot]={...(data.schedule[scheduled.slot]||{}),day:workoutDay}}

  planSnapshot:JSON.parse(JSON.stringify(cycle)),unit:data.unit,slot:scheduled?.slot||null,
  scheduledDate:workoutDate,started:new Date().toISOString(),finished:null,
  exercises:workout[1].map(e=>({name:e.name,sets:Array.from({length:e.sets},()=>({reps:prescribedReps(e.reps),weight:'',done:false}))}))};
 save();editing=id;editingPast=false;selectedDate=null;selectedSlot=null;tab='train';render();scrollTo(0,0);
}
function changeMovement(i,cmd){
 const s=data.sessions[editing],e=s&&s.exercises[i];if(!e||(s.finished&&!editingPast))return;
 if(cmd==='swap'){
  const answer=prompt('Replacement exercise (only for this session):',e.name);
  if(answer===null)return;
  const name=answer.trim().replace(/\s+/g,' ');
  if(!name||name.length>90){alert('Enter an exercise name up to 90 characters.');return}
  if(e.name!==name){if(!e.originalName)e.originalName=e.name;e.name=name;e.skipped=false}
 }else if(cmd==='original'){
  if(e.originalName){e.name=e.originalName;delete e.originalName;e.skipped=false}
 }else if(cmd==='skip'){e.skipped=!e.skipped}
 else if(cmd==='add'){if(e.sets.length>=20){alert('Maximum 20 sets.');return}e.sets.push({reps:prescribedReps(cycleForSession(s).days[s.day]?.[1]?.[i]?.reps||'8–12'),weight:'',done:false})}
 else if(cmd==='remove'){
  if(e.sets.length<=1){alert('At least one set is required. Skip this exercise instead.');return}
  const v=e.sets[e.sets.length-1];
  if((v.reps||v.weight||v.done)&&!confirm('Remove the last set and its logged data?'))return;
  e.sets.pop();
 }
 save();render();
}

 '<button class="btn tiny secondary" data-movement="add" data-index="'+i+'">+ Set</button>'+
 '<button class="btn tiny secondary" data-movement="remove" data-index="'+i+'">− Set</button>'+

}
function findActive(){return getSessions().find(s=>!s.finished)}
function finish(){
 const s=data.sessions[editing];if(!s||s.finished)return;
 const sets=s.exercises.filter(e=>!e.skipped).flatMap(e=>e.sets),checked=sets.filter(v=>v.done).length;
 const weighted=sets.filter(v=>loggedNumber(v.weight)!==null&&loggedNumber(v.reps)>0).length;
 if(!checked&&!weighted&&!confirm('No checked or weighted sets. Finish this workout anyway?'))return;
 if(!weighted&&checked&&!confirm('No sets have both reps and weight. Tonnage will be empty. Finish anyway?'))return;
 s.finished=s.previousFinishedAt||new Date().toISOString();delete s.previousFinishedAt;

}

function dateLocal(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function monthSchedule(m=month){const [y,mo]=m.split('-').map(Number),last=new Date(y,mo,0).getDate(),out=[];
for(let d=1;d<=last;d++){let date=new Date(y,mo-1,d),weekday=date.getDay(),idx=data.weekdays.indexOf(weekday);if(idx<0)continue;
let mon=new Date(date);mon.setDate(date.getDate()-((weekday+6)%7));const slot=m+'_'+isoDate(mon)+'_'+idx,override=data.schedule[slot]||{};const count=cycleFor(m).days.length;if(!count||override.status==='relocated')continue;
out.push({slot,day:Number.isInteger(override.day)&&override.day>=0&&override.day<count?override.day:idx%count,originalDay:idx,original:isoDate(date),date:override.date||isoDate(date),status:override.status||'planned'});}
return out.sort((a,b)=>a.date.localeCompare(b.date)||a.day-b.day)}
function fullMonthCalendar(ss,sessions){
 const [year,mo]=month.split('-').map(Number),days=new Date(year,mo,0).getDate(),first=(new Date(year,mo-1,1).getDay()+6)%7;
 const byDate={};for(const a of ss)(byDate[a.date]??=[]).push(a);
 const bySavedDate={};for(const s of sessions){const date=scheduledWorkoutDate(s);if(date.startsWith(month+'-'))(bySavedDate[date]??=[]).push(s)}
 const today=isoDate(new Date());let cells='';
 for(let i=0;i<first;i++)cells+='<div class="calendar-cell blank" aria-hidden="true"></div>';
 for(let d=1;d<=days;d++){
  const date=month+'-'+String(d).padStart(2,'0'),items=byDate[date]||[];
  const extra=(bySavedDate[date]||[]).filter(s=>!items.some(a=>sessionForScheduledDay(a,sessions)?.key===s.key));
  const plannedChips=items.map(a=>{const saved=sessionForScheduledDay(a,sessions),state=saved?.finished?'completed':saved?'ongoing':a.status==='skipped'?'skipped':'planned';
   return '<span class="calendar-chip '+state+' '+(a.original!==a.date?'moved':'')+'">'+
    esc('ABCDEFG'[saved?.day??a.day]||'?')+(state==='completed'?' ✓':state==='skipped'?' ×':state==='ongoing'?' …':'')+'</span>';
  }).join('');
  const otherChips=extra.map(s=>'<span class="calendar-chip '+(s.finished?'completed':'ongoing')+'">'+esc('ABCDEFG'[s.day]||'?')+
   (s.finished?' ✓':' …')+'</span>').join('');
  cells+='<div class="calendar-cell '+(date===today?'today ':'')+((items.length||extra.length)?'has-session ':'')+
   (selectedDate===date?'selected':'')+'" data-calendar-date="'+date+'" role="button" tabindex="0" aria-label="Choose workout on '+date+'">'+
   '<span class="calendar-daynum">'+d+'</span>'+plannedChips+otherChips+'</div>';
 }
 return '<div class="calendar-legend">'+
  '<span class="calendar-legend-item"><i class="legend-dot"></i>Planned</span>'+
  '<span class="calendar-legend-item"><i class="legend-dot completed"></i>Completed</span>'+
  '<span class="calendar-legend-item"><i class="legend-dot skipped"></i>Skipped</span>'+
  '<span class="calendar-legend-item"><i class="legend-dot ongoing"></i>In progress</span></div>'+
  '<div class="calendar-grid" aria-label="Monthly workout calendar">'+
  ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(w=>'<div class="calendar-weekday">'+w+'</div>').join('')+cells+
  '</div><p class="note">Tap any date to choose Workout A, B or C. The colours show planned, completed, skipped or in-progress workouts.</p>';
}

function storedSkippedSessions(){
 const result=[];
 for(const [slot,override] of Object.entries(data.schedule||{})){
  if(!override||override.status!=='skipped')continue;
  const match=/^(\d{4}-\d{2})_(\d{4}-\d{2}-\d{2})_(\d+)$/.exec(slot);
  if(!match)continue;
  const m=match[1],index=Number(match[3]);
  const a=monthSchedule(m).find(x=>x.slot===slot);
  // Existing skip entries predate saved day/date metadata. Reconstruct their
  // original scheduled date from the week and current weekday configuration.
  const monday=new Date(match[2]+'T12:00:00');
  const weekday=Array.isArray(data.weekdays)?data.weekdays[index]:null;
  const offset=Number.isInteger(weekday)?(weekday+6)%7:0;
  monday.setDate(monday.getDate()+offset);
  const date=override.date||a?.date||isoDate(monday),day=Number.isInteger(override.day)?override.day:a?.day??index;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date))continue;
  const hasWorkout=Object.values(data.sessions).some(s=>s&&(
   s.slot===slot||(s.scheduledDate===date&&s.month===m&&s.day===day)
  ));
  if(hasWorkout)continue;
  result.push({slot,date,day,month:m,legacy:!override.date&&!a});
 }

}

}

async function findFoods(q){

  const url='https://world.openfoodfacts.org/cgi/search.pl?search_terms='+encodeURIComponent(foodQuery)+'&search_simple=1&action=process&json=1&page_size=15&fields=code,product_name,brands,nutriments';

   products.push({name:p.product_name,kcal:k,protein:numeric('proteins_100g'),carbs:numeric('carbohydrates_100g'),fat:numeric('fat_100g'),code:p.code||'',source:p.brands?'Packaged · '+p.brands:'Open Food Facts',cup:null});
  }

 }catch(e){

 }

async function lookupBarcode(code){

  barcodeMessage=kcal===null?'No calorie data available; cannot log automatically.':'Check the label before adding.';

let barcodeScanToken=0,zxingReader=null,zxingLoading=null;
function updateBarcodeMessage(message){
 barcodeMessage=message;
 const status=document.getElementById('barcode-status');
 if(status)status.textContent=message;
}
function loadBarcodeLibrary(){
 if(window.ZXing?.BrowserMultiFormatReader)return Promise.resolve();
 if(zxingLoading)return zxingLoading;
 zxingLoading=new Promise((resolve,reject)=>{
  const script=document.createElement('script');
  script.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
  script.async=true;
  script.onload=()=>window.ZXing?.BrowserMultiFormatReader?resolve():reject(new Error('Barcode reader failed to initialize'));
  script.onerror=()=>reject(new Error('Barcode scanning library could not load. Check your internet connection'));
  document.head.appendChild(script);
 }).catch(error=>{zxingLoading=null;throw error});
 return zxingLoading;
}
function stopBarcodeCamera(){
 barcodeScanToken++;
 if(scanLoop)cancelAnimationFrame(scanLoop);
 scanLoop=null;
 if(zxingReader){try{zxingReader.reset()}catch(e){} zxingReader=null}
 if(cameraStream){cameraStream.getTracks().forEach(track=>track.stop());cameraStream=null}
 const video=document.getElementById('barcode-video');
 if(video){try{video.pause()}catch(e){} video.srcObject=null;video.style.display='none'}
}
function barcodeCameraError(error){
 if(error?.name==='NotAllowedError'||error?.name==='PermissionDeniedError')return 'Camera permission was denied. Allow camera access for Lift Journal in your iPhone settings or try Safari.';
 if(error?.name==='NotFoundError')return 'No camera was found on this device.';
 if(error?.name==='NotReadableError')return 'The camera is in use by another app. Close it and try again.';
 if(error?.name==='OverconstrainedError')return 'This camera mode is unsupported. Try opening the app in Safari.';
 return 'Camera scanner could not start: '+(error?.message||String(error));
}
async function startBarcodeCamera(){
 if(!navigator.mediaDevices?.getUserMedia){updateBarcodeMessage('Camera access is unavailable in this browser. Try opening Lift Journal in Safari, take a barcode photo below, or enter the digits.');return}
 stopBarcodeCamera();
 const token=++barcodeScanToken;
 updateBarcodeMessage('Loading iPhone-compatible barcode scanner…');
 try{
  await loadBarcodeLibrary();
  if(token!==barcodeScanToken||tab!=='calories')return;
  const video=document.getElementById('barcode-video');
  if(!video)throw Error('Camera preview not available');
  // Ask for permission without replacing the page: Home Screen apps may dismiss
  // the native prompt if their DOM is torn down while waiting for a response.
  updateBarcodeMessage('Requesting camera permission…');
  const stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});
  if(token!==barcodeScanToken||tab!=='calories'){stream.getTracks().forEach(t=>t.stop());return}
  cameraStream=stream;
  video.setAttribute('playsinline','');
  video.setAttribute('webkit-playsinline','');
  video.style.display='block';
  video.srcObject=stream;
  await video.play();
  if(token!==barcodeScanToken)return;
  updateBarcodeMessage('Point your camera at the barcode. Hold steady and keep it inside the frame.');
  const reader=new window.ZXing.BrowserMultiFormatReader();
  zxingReader=reader;
  await reader.decodeFromVideoElementContinuously(video,(result,error)=>{
   if(token!==barcodeScanToken||!result)return;
   const raw=result.getText?.()||String(result.text||'');
   const barcode=raw.replace(/[^0-9]/g,'');
   if(!/^\d{8,14}$/.test(barcode))return;
   stopBarcodeCamera();
   lookupBarcode(barcode);
  });
 }catch(error){
  if(token!==barcodeScanToken)return;
  stopBarcodeCamera();
  updateBarcodeMessage(barcodeCameraError(error)+' You can also take a photo or enter the barcode manually.');
 }
}
async function scanBarcodePhoto(file){
 if(!file)return;
 stopBarcodeCamera();
 updateBarcodeMessage('Reading barcode from photo…');
 let url;
 try{
  await loadBarcodeLibrary();
  url=URL.createObjectURL(file);
  const image=new Image();
  image.src=url;
  await new Promise((resolve,reject)=>{if(image.complete&&image.naturalWidth){resolve();return}image.onload=resolve;image.onerror=()=>reject(new Error('Could not open the photo'))});
  const reader=new window.ZXing.BrowserMultiFormatReader();
  const result=await reader.decodeFromImageElement(image);
  reader.reset();
  const barcode=String(result.getText?.()||result.text||'').replace(/[^0-9]/g,'');
  if(!/^\d{8,14}$/.test(barcode))throw Error('No food barcode found in this photo');
  lookupBarcode(barcode);
 }catch(error){updateBarcodeMessage('Could not read barcode: '+(error.message||error)+'. Try better lighting or enter the digits.')}
 finally{if(url)URL.revokeObjectURL(url)}
}

function gymDistance(lat1,lon1,lat2,lon2){

function parsePhotonGyms(json,lat,lon,radius){
 const result=[],seen=new Set();
 for(const feature of json?.features||[]){
  const c=feature?.geometry?.coordinates,props=feature?.properties||{};
  if(!Array.isArray(c)||c.length<2)continue;
  const a=Number(c[1]),b=Number(c[0]);
  if(!Number.isFinite(a)||!Number.isFinite(b))continue;
  const distance=gymDistance(lat,lon,a,b);
  if(distance>radius/1000)continue;
  const name=String(props.name||'').trim();
  if(!name)continue;
  const key=name.toLowerCase()+'|'+a.toFixed(4)+'|'+b.toFixed(4);
  if(seen.has(key))continue;seen.add(key);
  const address=[props.housenumber,props.street,props.city].filter(Boolean).join(', ');
  result.push({name,lat:a,lon:b,address,distance});
 }

}
