danger{background:#452730;color:#ffcccc}.btn.tiny{padding:8px 12px;font-size:12px}.btn:disabled{opacity:.5;cursor:not-allowed}.tabs{position:fixed;bottom:0;left:0;right:0;background:#111924ed;backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));display:flex;justify-content:center;gap:8px;z-index:10}.tabs button{background:none;border:0;color:var(--muted);font-size:12px;font-weight:650;padding:8px 15px;border-radius:10px;min-width:80px}.tabs button.selected{background:#263b3a;color:var(--accent)}.exercise{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:16px}.exercise small{color:var(--muted)}.setgrid{display:grid;grid-template-columns:45px 1fr 1fr 54px;gap:8px;align-items:center;margin-top:9px}.setgrid.head{color:var(--muted);font-size:12px}.setgrid input{min-width:0;width:100%;background:#0f1722;border:1px solid #3a4758;border-radius:9px;color:var(--text);padding:11px 8px;text-align:center}.check{width:32px;height:32px;accent-color:var(--accent);justify-self:center}.monthbar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px;margin:14px 0}.monthbar button{background:var(--surface2);color:var(--text);border:0;border-radius:9px;padding:9px 13px}.monthbar strong{text-align:center}.muted{color:var(--muted)}.note{font-size:12px;color:var(--muted)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:var(--surface2);border-radius:12px;padding:12px;text-align:center}.metric strong{display:block;font-size:23px;color:var(--accent)}.metric span{font-size:11px;color:var(--muted)}.history-item{border-bottom:1px solid var(--line);padding:13px 0}.history-item:last-child{border:0}.empty{padding:30px 16px;text-align:center;color:var(--muted)}.input-label{display:block;color:var(--muted);font-size:12px;margin:13px 0 6px}select{width:100%;background:var(--surface2);color:var(--text);padding:12px;border:1px solid var(--line);border-radius:10px}.hide{display:none!important}.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:var(--accent);color:#10231c;padding:11px 16px;border-radius:12px;font-weight:800;z-index:30;box-shadow:0 7px 30px #0008;max-width:90vw;white-space:nowrap}.week{font-size:12px;color:var(--muted)}.progress{height:7px;border-radius:20px;background:#31404a;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:var(--accent);transition:width .2s}.restore{width:100%;padding:10px;border:1px dashed var(--line);border-radius:12px}.right{text-align:right}.schedule-row{display:flex;justify-content:space-between;gap:8px;align-items:center;border-top:1px solid var(--line);padding:12px 0}.schedule-row .row{gap:5px}.move-panel{border:1px solid #47735e;border-radius:12px;padding:13px;margin-top:10px;background:#19332c}.move-panel input{width:100%;background:var(--surface2);color:var(--text);padding:12px;border:1px solid var(--line);border-radius:10px}@media(max-width:420px){.schedule-row{align-items:flex-start}.schedule-row .btn{padding:7px 8px}}.calendar-legend{display:flex;flex-wrap:wrap;gap:9px 14px;margin:13px 0;font-size:12px;color:var(--muted)}.legend-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:#9dc8ff}.legend-dot.completed{background:#83e6b6}.legend-dot.skipped{background:#ff9b9b}.legend-dot.progress{background:#f1cc83}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:12px 0 18px}.calendar-weekday{text-align:center;font-size:11px;color:var(--muted);padding:5px 0}.calendar-cell{min-height:64px;border:1px solid #303b4d;border-radius:10px;background:#121a27;padding:6px 3px;color:var(--text);text-align:left;min-width:0}.calendar-cell.blank{border:0;background:transparent}.calendar-cell.today{border-color:#9dc8ff}.calendar-cell.has-session{cursor:pointer}.calendar-cell.selected{outline:2px solid var(--accent);background:#20372f}.calendar-daynum{font-weight:750;font-size:12px;display:block;padding-left:3px}.calendar-chip{display:block;border-radius:5px;padding:3px 2px;margin-top:4px;font-size:10px;line-height:1.2;text-align:center;overflow:hidden;background:#263f59;color:#c5ddff;font-weight:750}.calendar-chip.completed{background:#1b4d3a;color:#9df1bd}.calendar-chip.skipped{background:#4e2832;color:#ffb9bd;text-decoration:line-through}.calendar-chip.progress{background:#4a4128;color:#ffe4a9}.calendar-chip.moved{box-shadow:inset 0 0 0 1px #9dc8ff}@media(max-width:390px){.calendar-grid{gap:3px}.calendar-cell{min-height:60px;padding:4px 2px}.calendar-chip{font-size:9px}}details{margin-top:8px}summary{cursor:pointer;color:var(--accent2)}@media(min-width:620px){.workout-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.workout{min-height:145px}.shell{padding-top:30px}}

.previous-performance{margin:11px 0 14px;background:#101f2a;border:1px solid #355264;border-radius:12px;padding:12px}
.previous-header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-weight:750;font-size:13px}
.previous-sets{color:var(--text);font-size:13px;line-height:1.65;margin:7px 0;overflow-wrap:anywhere}
.progression-tip{font-size:13px;line-height:1.45;border-radius:9px;padding:9px 10px;margin-top:8px;background:#283442;color:#dce8f4}
.progression-tip.increase{background:#1b4436;color:#aaf4ce}
.progression-tip.hold{background:#303c4b;color:#d1e4fa}
.progression-tip.caution{background:#4b3724;color:#ffdfa8}
.progression-tip.unknown{background:#283442;color:#bfd0df}
.prev-preview{color:var(--muted);font-size:12px;margin-top:5px;line-height:1.4}
.prev-preview b{font-weight:750;color:var(--accent2)}
.exercise-summary{min-width:0;flex:1}
.exercise-summary-title{font-weight:500}
.personal-builder textarea{width:100%;min-height:135px;background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px;font:13px/1.5 monospace}.personal-builder select,.personal-builder input{width:100%;margin-bottom:10px}.personal-builder label{display:block;color:var(--muted);font-size:13px;margin:9px 0 5px}.personal-builder .note{margin-top:8px}.exercise-tools{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.exercise-tools .btn{font-size:12px;padding:7px 9px}.exercise-skipped{opacity:.72}.exercise-sub{color:var(--accent2);font-size:12px;margin:7px 0}</style></head><body><main class="shell" id="app"></main><nav class="tabs" id="nav"><button data-tab="home">⌂<br>Plan</button><button data-tab="train">▣<br>Train</button><button data-tab="history">◷<br>History</button><button data-tab="settings">⚙<br>Settings</button></nav><script>
(()=>{'use strict';
const KEY='lift-journal-v1',names=['January','February','March','April','May','June','July','August','September','October','November','December'];
// Program changes are manual. Each program repeats A/B/C until the user advances.
const X=(name,sets,reps,rest=90)=>({name,sets,reps,rest});
const cycles=[
{label:'Foundation',focus:'Build consistency and technique',days:[['Full Body A',[X('Pendulum Squat',3,'8–10',120),X('Dumbbell Bench Press',3,'8–12'),X('Lat Pulldown',3,'10–12'),X('Leg Curl Machine',3,'10–15'),X('Cable Triceps Pushdown',2,'12–15')]],['Full Body B',[X('Dumbbell Romanian Deadlift',3,'8–10',120),X('Seated Cable Row',3,'10–12'),X('Incline Dumbbell Press',3,'8–12'),X('Dumbbell Lateral Raise',3,'12–15'),X('Dumbbell Curl',2,'10–12')]],['Full Body C',[X('Pendulum Squat',3,'10–12',120),X('Flat Bench Press',3,'6–10',120),X('Neutral-Grip Lat Pulldown',3,'8–12'),X('Cable Face Pull',3,'12–15'),X('Standing Dumbbell Calf Raise',3,'12–20')]]]},
{label:'Strength Builder',focus:'Progress the main lifts',days:[['Strength A',[X('Flat Bench Press',4,'5–8',150),X('Pendulum Squat',3,'6–8',150),X('Seated Cable Row',3,'8–10'),X('Leg Curl Machine',3,'10–12'),X('Cable Crunch',3,'12–15')]],['Strength B',[X('Dumbbell Romanian Deadlift',4,'6–8',150),X('Lat Pulldown',4,'8–10'),X('Seated Dumbbell Shoulder Press',3,'8–10'),X('Cable Triceps Pushdown',3,'10–12'),X('Dumbbell Curl',3,'10–12')]],['Strength C',[X('Pendulum Squat',4,'6–8',150),X('Incline Dumbbell Bench Press',4,'8–10'),X('One-Arm Cable Row',3,'10–12 / side'),X('Dumbbell Lateral Raise',3,'12–15'),X('Standing Dumbbell Calf Raise',3,'12–15')]]]},
{label:'Hypertrophy Mix',focus:'More volume and exercise variety',days:[['Build A',[X('Pendulum Squat',4,'10–12',120),X('Incline Dumbbell Bench Press',3,'10–12'),X('Wide-Grip Lat Pulldown',3,'10–12'),X('Leg Curl Machine',3,'12–15'),X('Cable Lateral Raise',3,'12–15')]],['Build B',[X('Dumbbell Romanian Deadlift',3,'10–12',120),X('Close-Grip Seated Cable Row',4,'10–12'),X('Flat Dumbbell Bench Press',3,'10–12'),X('Rope Triceps Pushdown',3,'12–15'),X('Hammer Curl',3,'10–15')]],['Build C',[X('Dumbbell Split Squat',3,'10 / side',120),X('Flat Bench Press',3,'8–10'),X('Underhand Lat Pulldown',3,'10–12'),X('Cable Face Pull',3,'15–20'),X('Cable Crunch',3,'12–15')]]]},
{label:'Balanced Progress',focus:'Keep developing strength and control',days:[['Progress A',[X('Pendulum Squat',3,'8–10',120),X('Flat Dumbbell Bench Press',4,'8–10'),X('Seated Cable Row',3,'8–12'),X('Leg Curl Machine',3,'12–15'),X('Dumbbell Lateral Raise',2,'15–20')]],['Progress B',[X('Dumbbell Romanian Deadlift',3,'8–10',120),X('Neutral-Grip Lat Pulldown',4,'8–10'),X('Seated Dumbbell Shoulder Press',3,'8–12'),X('Cable Biceps Curl',3,'10–15'),X('Rope Triceps Pushdown',3,'10–15')]],['Progress C',[X('Dumbbell Reverse Lunge',3,'10 / side',120),X('Incline Dumbbell Bench Press',3,'8–12'),X('One-Arm Dumbbell Row',3,'10 / side'),X('Cable Face Pull',3,'12–20'),X('Standing Dumbbell Calf Raise',3,'15–20')]]]}];
const today=new Date(),initialMonth=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0');
const blank=()=>({sessions:{},unit:'lb',weekdays:[1,3,5],schedule:{},program:{index:0,number:1,started:new Date().toISOString(),history:[]}});let data;try{data=JSON.parse(localStorage.getItem(KEY))||blank();if(!data.sessions||!['kg','lb'].includes(data.unit))throw 0}catch{data=blank()}
if(!Array.isArray(data.weekdays)||data.weekdays.length!==3)data.weekdays=[1,3,5];if(!data.schedule||typeof data.schedule!=='object')data.schedule={};if(!data.program||!Number.isInteger(data.program.index)){data.program={index:0,number:1,started:new Date().toISOString(),history:[]};}if(!Array.isArray(data.program.history))data.program.history=[];if(data.customPlan&&!Array.isArray(data.customPlan.days))data.customPlan=null;let month=initialMonth,tab='home',day=0,editing=null,selectedSlot=null;const el=document.getElementById('app');
function save(){localStorage.setItem(KEY,JSON.stringify(data))}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cycleFor(m){return data.customPlan||cycles[data.program.index%cycles.length]}
function cycleForSession(s){if(s.planSnapshot)return s.planSnapshot;if(Number.isInteger(s.cycleIndex))return cycles[s.cycleIndex%cycles.length];const [y,mo]=s.month.split('-').map(Number);return cycles[(y*12+mo-1)%cycles.length]}
function startNextProgram(){if(Object.values(data.sessions).some(s=>!s.finished)&&!confirm('You have an unfinished workout. Continue anyway? It will remain in your history.'))return;if(!confirm('Start the next program? Your current program will be archived, and all recorded workouts will stay in your history.'))return;const old=data.program;old.history.push({number:old.number,index:old.index,started:old.started,ended:new Date().toISOString()});data.customPlan=null;old.number+=1;old.index=(old.index+1)%cycles.length;old.started=new Date().toISOString();month=initialMonth;data.schedule={};selectedSlot=null;day=0;editing=null;save();tab='home';render();toast('New program started')}
function labelMonth(m){let [y,mo]=m.split('-').map(Number);return names[mo-1]+' '+y}function shiftMonth(d){let [y,mo]=month.split('-').map(Number);const x=new Date(y,mo-1+d,1);month=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');editing=null;render()}
function isoDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function getSessions(m=month){return Object.entries(data.sessions).filter(([k,v])=>v.month===m).map(([key,v])=>({...v,key})).sort((a,b)=>b.started.localeCompare(a.started))}
function planned(){return cycleFor(month).days[day]}

function loggedNumber(v){if(v===null||v===undefined||String(v).trim()==='')return null;const n=Number(v);return Number.isFinite(n)&&n>=0?n:null}
function pastExercise(name,before){
 const ss=Object.values(data.sessions).filter(s=>s&&s.finished&&(!before||s.finished<=before)).sort((a,b)=>String(b.finished).localeCompare(String(a.finished)));
 for(const s of ss){const e=(Array.isArray(s.exercises)?s.exercises:[]).find(x=>x.name===name);if(!e||!Array.isArray(e.sets))continue;
 const sets=e.skipped?[]:e.sets.map((v,i)=>({index:i+1,weight:loggedNumber(v.weight),reps:loggedNumber(v.reps),done:!!v.done})).filter(v=>v.done&&v.weight!==null&&v.reps!==null&&v.reps>0);
 if(sets.length)return {sets,date:s.finished,unit:s.unit||data.unit,legacyUnit:!s.unit};}
 return null;
}
function repGoal(reps){const nums=String(reps).match(/\d+/g);if(!nums)return null;const min=Number(nums[0]),max=nums.length>1&&/[–-]/.test(String(reps))?Number(nums[1]):min;return {min,max}}
function formatWeight(n){return Number(n).toLocaleString(undefined,{maximumFractionDigits:2})}
function adviceFor(ex,last){
 if(!last)return {kind:'unknown',title:'No previous weights yet',details:'Log and complete a workout to get a comparison next time.'};
 if(last.unit!==data.unit)return {kind:'unknown',title:'Check your weight units',details:'Your last session used '+last.unit+', but Settings currently shows '+data.unit+'. Units are not automatically converted, so no increase is suggested.'};
 const goal=repGoal(ex.reps);if(!goal)return {kind:'unknown',title:'Review your last workout',details:'There is no clear rep target for this exercise.'};
 if(last.sets.length<ex.sets)return {kind:'hold',title:'Build a complete baseline',details:'Last time, only '+last.sets.length+' of '+ex.sets+' prescribed sets had checked reps and weights. Complete all sets before increasing.'};
 const working=last.sets.slice(0,ex.sets);
 if(working.some(v=>v.reps<goal.min))return {kind:'caution',title:'Build reps first',details:'At least one set was below '+goal.min+' reps. Keep or reduce weight as needed to hit the range with good form.'};
 if(working.some(v=>v.reps<goal.max))return {kind:'hold',title:'Keep the weight for now',details:'Aim for '+goal.max+' reps on all '+ex.sets+' sets with good form before increasing.'};
 const w=working[0].weight;
 if(w<=0||working.some(v=>Math.abs(v.weight-w)>0.00001))return {kind:'hold',title:'Repeat and standardize',details:'Your completed sets used different weights (or zero added weight). Build consistent sets before increasing.'};
 return {kind:'increase',title:'Small increase may be appropriate',details:'You reached at least '+goal.max+' reps on all '+ex.sets+' sets at '+formatWeight(w)+' '+last.unit+'. If your form was controlled and you had 1–3 reps in reserve, try roughly 2.5–5% more next time if available.'};
}
function lastSetText(last){return last.sets.map(s=>'Set '+s.index+': '+formatWeight(s.weight)+' '+last.unit+' × '+formatWeight(s.reps)).join(' · ')}
function previousPanel(ex,before){
 const last=pastExercise(ex.name,before),tip=adviceFor(ex,last);
 const date=last?'<span class="note">'+new Date(last.date).toLocaleDateString()+'</span>':'';
 const sets=last?'<div class="previous-sets">'+esc(lastSetText(last))+'</div>':'';
 const unitNote=last&&last.legacyUnit?'<div class="note" style="margin-top:7px">Older sessions did not record their unit separately. Double-check these numbers if you have switched lb/kg.</div>':'';
 return '<div class="previous-performance"><div class="previous-header"><span>↺ Last workout</span>'+date+'</div>'+sets+'<div class="progression-tip '+tip.kind+'"><strong>'+esc(tip.title)+'</strong><div>'+esc(tip.details)+'</div></div>'+unitNote+'</div>';
}
function previousPreview(ex){
 const last=pastExercise(ex.name),tip=adviceFor(ex,last);
 if(!last)return '<div class="prev-preview">No previous workout logged</div>';
 const label=tip.kind==='increase'?'Consider increasing':tip.kind==='caution'?'Build reps first':tip.kind==='hold'?'Keep weight':'Review units';
 return '<div class="prev-preview">Last: '+esc(lastSetText(last))+' <b>· '+esc(label)+'</b></div>';
}
function newSession(){const [n,ex]=planned(),id=Date.now()+'-'+Math.random().toString(36).slice(2,7);const obj={month,day,cycleIndex:data.program.index,programNumber:data.program.number,planSnapshot:JSON.parse(JSON.stringify(cycleFor(month))),unit:data.unit,slot:selectedSlot,started:new Date().toISOString(),finished:null,exercises:ex.map(e=>({name:e.name,sets:Array.from({length:e.sets},(_,i)=>({reps:'',weight:'',done:false}))}))};data.sessions[id]=obj;save();editing=id;selectedSlot=null;tab='train';render()}

function changeMovement(i,cmd){
 const s=data.sessions[editing],e=s&&s.exercises[i];if(!e||s.finished)return;
 if(cmd==='swap'){
  const answer=prompt('Replacement exercise (only for this session):',e.name);
  if(answer===null)return;
  const name=answer.trim().replace(/\s+/g,' ');
  if(!name||name.length>90){alert('Enter an exercise name up to 90 characters.');return}
  if(e.name!==name){if(!e.originalName)e.originalName=e.name;e.name=name;e.skipped=false}
 }else if(cmd==='original'){
  if(e.originalName){e.name=e.originalName;delete e.originalName;e.skipped=false}
 }else if(cmd==='skip'){e.skipped=!e.skipped}
 else if(cmd==='add'){if(e.sets.length>=20){alert('Maximum 20 sets.');return}e.sets.push({reps:'',weight:'',done:false})}
 else if(cmd==='remove'){
  if(e.sets.length<=1){alert('At least one set is required. Skip this exercise instead.');return}
  const v=e.sets[e.sets.length-1];
  if((v.reps||v.weight||v.done)&&!confirm('Remove the last set and its logged data?'))return;
  e.sets.pop();
 }
 save();render();
}
function sessionMovementActions(e,i,s){
 if(s.finished)return '';
 return '<div class="exercise-tools">'+
 '<button class="btn tiny secondary" data-movement="swap" data-index="'+i+'">Swap exercise</button>'+
 '<button class="btn tiny secondary" data-movement="skip" data-index="'+i+'">'+(e.skipped?'Restore exercise':'Skip exercise')+'</button>'+
 '<button class="btn tiny secondary" data-movement="add" data-index="'+i+'">+ Set</button>'+
 '<button class="btn tiny secondary" data-movement="remove" data-index="'+i+'">− Set</button>'+
 (e.originalName?'<button class="btn tiny secondary" data-movement="original" data-index="'+i+'">Use original</button>':'')+'</div>';
}
function findActive(){return getSessions().find(s=>!s.finished)}
function finish(){let s=data.sessions[editing];if(!s)return;const total=s.exercises.filter(e=>!e.skipped).flatMap(e=>e.sets),count=total.filter(x=>x.done).length;if(!count&&!confirm('No sets checked yet. Finish this workout anyway?'))return;s.finished=new Date().toISOString();save();editing=null;tab='history';toast('Workout saved');render()}
function toast(s){document.querySelector('.toast')?.remove();const n=document.createElement('div');n.className='toast';n.textContent=s;document.body.append(n);setTimeout(()=>n.remove(),2300)}
function button(text,action,cls=''){return `<button class="btn ${cls}" data-action="${action}">${text}</button>`}
function header(sub){return `<div class="top"><div class="logo">LIFT<b>JOURNAL</b></div><span class="pill">3 DAYS / WEEK</span></div>${sub}`}
function monthControl(){return `<div class="monthbar"><button data-action="prev">←</button><strong>${labelMonth(month)}</strong><button data-action="next">→</button></div>`}
function dayCards(){let c=cycleFor(month);return `<div class="workout-grid">${c.days.map(([name,ex],i)=>`<button class="workout ${day===i?'active':''}" data-day="${i}"><span class="tag">WORKOUT ${'ABC'[i]}</span><div class="name">${esc(name)}</div><div class="small">${ex.length} exercises · ${ex.reduce((a,e)=>a+e.sets,0)} total sets</div></button>`).join('')}</div>`}

const weekdayNames=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function dateLocal(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function monthSchedule(m=month){const [y,mo]=m.split('-').map(Number),last=new Date(y,mo,0).getDate(),out=[];
for(let d=1;d<=last;d++){let date=new Date(y,mo-1,d),weekday=date.getDay(),idx=data.weekdays.indexOf(weekday);if(idx<0)continue;
let mon=new Date(date);mon.setDate(date.getDate()-((weekday+6)%7));const slot=m+'_'+isoDate(mon)+'_'+idx,override=data.schedule[slot]||{};if(idx>=cycleFor(m).days.length)continue;
out.push({slot,day:idx,original:isoDate(date),date:override.date||isoDate(date),status:override.status||'planned'});}
return out.sort((a,b)=>a.date.localeCompare(b.date)||a.day-b.day)}
function fullMonthCalendar(ss,sessions){
 const [year,mo]=month.split('-').map(Number),days=new Date(year,mo,0).getDate(),first=(new Date(year,mo-1,1).getDay()+6)%7;
 const byDate={};for(const a of ss){(byDate[a.date]??=[]).push(a)}
 const today=isoDate(new Date());let cells='';
 for(let pad=0;pad<first;pad++)cells+='<div class="calendar-cell blank" aria-hidden="true"></div>';
 for(let d=1;d<=days;d++){
  const date=month+'-'+String(d).padStart(2,'0'),items=byDate[date]||[];
  cells+=`<div class="calendar-cell ${date===today?'today ':''}${items.length?'has-session':''} ${items.some(a=>a.slot===selectedSlot)?'selected':''}" ${items.length?`data-calendar-date="${date}" role="button" tabindex="0" aria-label="${date}: ${items.map(a=>'Workout '+ 'ABC'[a.day]).join(', ')}"`:''}><span class="calendar-daynum">${d}</span>${items.map(a=>{const logged=sessions.find(v=>v.slot===a.slot),status=logged?.finished?'completed':logged?'progress':a.status==='skipped'?'skipped':'planned';return `<span class="calendar-chip ${status} ${a.original!==a.date?'moved':''}">${'ABC'[a.day]} ${status==='completed'?'✓':status==='skipped'?'×':status==='progress'?'…':''}</span>`}).join('')}</div>`;
 }
 return `<div class="calendar-legend"><span><i class="legend-dot"></i>Upcoming</span><span><i class="legend-dot completed"></i>Completed</span><span><i class="legend-dot skipped"></i>Skipped</span><span><i class="legend-dot progress"></i>In progress</span></div><div class="calendar-grid" aria-label="Monthly workout calendar">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(w=>`<div class="calendar-weekday">${w}</div>`).join('')}${cells}</div><p class="note">Tap a workout date to select its session, then use the controls below to move, skip, restore, or start it. Outlined workout labels were rescheduled.</p>`;
}
function scheduleView(){const sessions=getSessions(),ss=monthSchedule();return `<section class="card"><div class="row"><div><h2 style="margin:0">Your workout calendar</h2><span class="note">Change weekly days in Settings. Move or skip any session below.</span></div></div>${fullMonthCalendar(ss,sessions)}${ss.map(a=>{const logged=sessions.find(v=>v.slot===a.slot),status=logged?.finished?'Completed':logged?'In progress':a.status==='skipped'?'Skipped':a.date!==a.original?'Moved':'Planned';return `<div class="schedule-row"><div><strong>${new Date(a.date+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})} · Workout ${'ABC'[a.day]}</strong><div class="note">${status}${a.date!==a.original?' · originally '+a.original:''}</div></div><div class="row" style="justify-content:flex-end;flex-wrap:wrap">${logged?`<button class="btn tiny secondary" data-open="${esc(logged.key)}">View</button>`:`<button class="btn tiny secondary" data-slot="${esc(a.slot)}" data-plan-day="${a.day}">Select</button><button class="btn tiny ${a.status==='skipped'?'secondary':'danger'}" data-skip="${esc(a.slot)}">${a.status==='skipped'?'Restore':'Skip'}</button>`}</div></div>`}).join('')}${!ss.length?'<p class="muted">No sessions scheduled this month.</p>':''}${selectedSlot&&ss.some(a=>a.slot===selectedSlot)?(()=>{let a=ss.find(a=>a.slot===selectedSlot);return `<div class="move-panel"><h3>Workout ${'ABC'[a.day]} · ${esc(a.date)}</h3><label class="input-label" for="move-date">Move this session to another date in ${labelMonth(month)}</label><input id="move-date" type="date" value="${a.date}" min="${month}-01" max="${month}-${String(new Date(Number(month.slice(0,4)),Number(month.slice(5)),0).getDate()).padStart(2,'0')}"><div class="row" style="margin-top:10px">${button('Save date','move','secondary')}${button('Start this workout','start')}</div></div>`})():''}</section>`}

function home(){let c=cycleFor(month),ss=Object.values(data.sessions).filter(x=>x.programNumber===data.program.number&&x.finished);return header(`<h1>Your training plan</h1><p class="sub">Repeat the same routine as long as you need. You decide when to change programs.</p>`)+monthControl()+`<section class="card hero"><div class="eyebrow">PROGRAM ${data.program.number} · ${esc(c.label)}</div><h2 style="margin-top:8px">${esc(c.focus)}</h2><p class="muted" style="margin:0">Repeat workouts A, B and C each week on your chosen days. Reschedule or skip individual sessions using your calendar below.</p><div class="progress"><div style="width:${Math.min(100,ss.filter(x=>x.finished).length/12*100)}%"></div></div><span class="note">${ss.filter(x=>x.finished).length} completed sessions in this program · suggested target 12</span><div style="margin-top:15px">${button('Start next program →','advance','secondary')}</div><p class="note">No automatic changes at month-end. Continue this program for as many weeks as you like.</p></section>${scheduleView()}<h2>Choose your workout</h2>${dayCards()}<section class="card"><div class="row"><div><h3>Workout ${'ABC'[day]} preview</h3><span class="hint">Sets × rep target</span></div>${button('Start','start')}</div>${c.days[day][1].map(e=>`<div class="row" style="border-top:1px solid var(--line);padding:11px 0"><div class="exercise-summary"><div class="exercise-summary-title">${esc(e.name)}</div>${previousPreview(e)}</div><strong style="white-space:nowrap">${e.sets} × ${esc(e.reps)}</strong></div>`).join('')}</section><p class="note">Suggested beginner-to-intermediate plan. Start with manageable weights and maintain good form. Rep targets are ranges, not required minimums.</p>`}
function sessionView(){
 const s=data.sessions[editing];if(!s){editing=null;return train()}
 const c=cycleForSession(s),def=c.days[s.day][1],active=s.exercises.filter(e=>!e.skipped);
 const done=active.reduce((n,e)=>n+e.sets.filter(v=>v.done).length,0),total=active.reduce((n,e)=>n+e.sets.length,0);
 let output=header('<h1>'+esc(c.days[s.day][0])+'</h1><p class="sub">Program '+(s.programNumber||'legacy')+' · '+labelMonth(s.month)+' · '+(s.finished?'Completed session':'Your training session')+' · '+done+'/'+total+' sets logged</p>');
 output+='<div class="progress"><div style="width:'+(total?100*done/total:0)+'%"></div></div><div class="row">'+button('← Back','back','secondary')+'<span class="hint">Weight ('+esc(s.unit||data.unit)+')</span></div>';
 s.exercises.forEach((ex,i)=>{
  const d=def[i]||{name:ex.originalName||ex.name,reps:'8–12',sets:ex.sets.length,rest:90},disabled=s.finished||ex.skipped;
  output+='<section class="exercise'+(ex.skipped?' exercise-skipped':'')+'"><h3>'+(i+1)+'. '+esc(ex.name)+(ex.skipped?' (Skipped)':'')+'</h3>';
  output+='<small>Plan: '+d.sets+' × '+esc(d.reps)+' · Actual sets: '+ex.sets.length+' · Rest ~'+d.rest+'s</small>';
  if(ex.originalName)output+='<div class="exercise-sub">Substituted for '+esc(ex.originalName)+' (this session only)</div>';
  output+=sessionMovementActions(ex,i,s);
  if(ex.skipped){output+='<p class="note">Skipped — not counted as a completed movement.</p></section>';return}
  output+=previousPanel({...d,name:ex.name,sets:ex.sets.length},s.started);
  output+='<div class="setgrid head"><span>SET</span><span>REPS</span><span>'+esc((s.unit||data.unit).toUpperCase())+'</span><span>DONE</span></div>';
  ex.sets.forEach((v,j)=>{
   const attrs=' data-ex="'+i+'" data-set="'+j+'"';
   const dis=disabled?' disabled':'';
   output+='<div class="setgrid"><span class="muted">'+(j+1)+'</span>';
   output+='<input aria-label="Set '+(j+1)+' reps for '+esc(ex.name)+'" type="number" inputmode="numeric" min="0" step="1" placeholder="'+esc((String(d.reps).match(/\d+/)||['10'])[0])+'" data-field="reps"'+attrs+' value="'+esc(v.reps)+'"'+dis+'>';
   output+='<input aria-label="Set '+(j+1)+' weight for '+esc(ex.name)+'" type="number" inputmode="decimal" min="0" step="0.5" placeholder="0" data-field="weight"'+attrs+' value="'+esc(v.weight)+'"'+dis+'>';
   output+='<input aria-label="Set '+(j+1)+' completed" type="checkbox" class="check" data-field="done"'+attrs+(v.done?' checked':'')+dis+'></div>';
  });
  output+='</section>';
 });
 output+='<section class="card"><p class="note">All changes apply only to this session. Log any reps you actually complete, even outside the suggested range. Sets and skipped movements save locally.</p>'+(s.finished?button('Back to history','history','secondary'):button('Finish & save workout','finish'))+'</section>';
 return output;
}
function train(){if(editing&&data.sessions[editing])return sessionView();let active=findActive(),c=cycleFor(month);return header(`<h1>Train</h1><p class="sub">Start a scheduled workout, select another day, or pick up where you left off.</p>`)+monthControl()+(active?`<div class="card hero"><h2>Unfinished workout</h2><p class="muted">Started ${new Date(active.started).toLocaleString()}</p>${button('Resume session','resume')}</div>`:'')+scheduleView()+dayCards()+`<section class="card"><h2>${esc(c.days[day][0])}</h2>${c.days[day][1].map(e=>`<div class="row" style="border-top:1px solid var(--line);padding:11px 0"><div class="exercise-summary"><div class="exercise-summary-title">${esc(e.name)}</div>${previousPreview(e)}</div><strong style="white-space:nowrap">${e.sets} × ${esc(e.reps)}</strong></div>`).join('')}${button('Start new workout','start')}</section>`}
function history(){let entries=Object.entries(data.sessions).map(([key,s])=>({...s,key})).sort((a,b)=>b.started.localeCompare(a.started)),completed=entries.filter(s=>s.finished),sets=completed.reduce((n,s)=>n+s.exercises.reduce((a,e)=>a+e.sets.filter(v=>v.done).length,0),0);return header(`<h1>Workout history</h1><p class="sub">Review the weights, reps and sets you've logged.</p>`)+`<div class="summary"><div class="metric"><strong>${completed.length}</strong><span>Workouts</span></div><div class="metric"><strong>${sets}</strong><span>Sets done</span></div><div class="metric"><strong>${new Set(completed.map(s=>s.month)).size}</strong><span>Months active</span></div></div>`+(entries.length?`<section class="card">${entries.map(s=>`<div class="history-item"><div class="row"><div><strong>${esc(cycleForSession(s).days[s.day][0])}</strong><div class="note">${new Date(s.started).toLocaleDateString()} · Program ${s.programNumber||'legacy'} · ${s.finished?'Completed':'In progress'} · ${s.exercises.reduce((n,e)=>n+e.sets.filter(v=>v.done).length,0)} sets</div></div><button class="btn tiny secondary" data-open="${esc(s.key)}">View</button></div></div>`).join('')}</section>`:'<div class="card empty">No workouts yet. Start your first session to build your history.</div>')}

const exerciseBank={
 legs:['Pendulum Squat','Leg Curl Machine','Dumbbell Romanian Deadlift','Dumbbell Reverse Lunge','Standing Dumbbell Calf Raise'],
 push:['Dumbbell Bench Press','Incline Dumbbell Bench Press','Flat Bench Press','Seated Dumbbell Shoulder Press','Cable Triceps Pushdown'],
 pull:['Lat Pulldown','Seated Cable Row','One-Arm Cable Row','Dumbbell Curl','Cable Face Pull'],
 core:['Cable Crunch','Dumbbell Lateral Raise','Standing Dumbbell Calf Raise']
};
function generatedRoutine(goal,days,equipment){
 const strength=goal==='strength',fat=goal==='general',sets=strength?4:fat?2:3,reps=strength?'5–8':fat?'10–15':'8–12';
 const choose=(group,i)=>{let arr=exerciseBank[group].filter(x=>equipment==='dumbbells'?(!/Cable|Pulldown|Pendulum|Leg Curl|Bench Press$/.test(x)||x==='Dumbbell Bench Press'):equipment==='cables'? !/Dumbbell|Pendulum|Leg Curl|Flat Bench/.test(x):true);
 if(!arr.length)arr=exerciseBank[group];return arr[i%arr.length]};
 const result=[];
 for(let i=0;i<days;i++){
  const names=[choose('legs',i),choose('push',i),choose('pull',i),choose('legs',i+1),choose(i%2?'pull':'push',i+2)];
  result.push(['Full Body '+String.fromCharCode(65+i),names.map((n,j)=>X(n,j===4?2:sets,j===4?'12–15':reps,j===0?120:90))]);
 }
 return {label:'Personalized '+goal,focus:'Generated for '+days+' days weekly · '+equipment,days:result};
}
function planBuilder(){
 const p=cycleFor(month),lines=p.days.map(x=>x[1].map(e=>e.name+' | '+e.sets+' | '+e.reps).join('\n'));
 return '<section class="card personal-builder"><h2>Personalize your workouts</h2><p class="muted">Generate a full-body routine or build your own. Your changes apply only on this device; friends can create different plans on their phones.</p>'+
 '<h3>Automatic generator</h3><label for="gen-goal">Primary goal</label><select id="gen-goal"><option value="muscle">Build muscle</option><option value="strength">Gain strength</option><option value="general">General fitness</option></select>'+
 '<label for="gen-days">Days per week</label><select id="gen-days"><option value="3">3 days</option><option value="2">2 days</option></select>'+
 '<label for="gen-equipment">Available equipment</label><select id="gen-equipment"><option value="all">Full gym / your listed equipment</option><option value="dumbbells">Mostly dumbbells</option><option value="cables">Mostly cables</option></select>'+
 button('Generate my program','generate','secondary')+
 '<p class="note">The generator uses predefined exercise selections. Review them and adjust as needed; it is not a professional coaching assessment.</p>'+
 '<h3>Manual builder</h3><label for="plan-title">Program name</label><input id="plan-title" maxlength="65" value="'+esc(p.label)+'">'+
 '<label for="plan-days">Workout days per week</label><select id="plan-days"><option value="3" '+(p.days.length===3?'selected':'')+'>3 days</option><option value="2" '+(p.days.length===2?'selected':'')+'>2 days</option></select>'+
 [0,1,2].map(i=>'<div class="manual-day" data-builder-day="'+i+'" '+(i>=p.days.length?'hidden':'')+'><label for="manual-'+i+'">Workout '+String.fromCharCode(65+i)+' — one exercise per line</label><textarea id="manual-'+i+'" spellcheck="false" placeholder="Dumbbell Bench Press | 3 | 8-12">'+esc(lines[i]||'')+'</textarea></div>').join('')+
 '<p class="note">Format: Exercise name | sets | reps. Example: Seated Cable Row | 3 | 10-12. Up to 12 exercises per workout, 1–10 sets each.</p>'+
 button('Save my custom program','save-plan')+'</section>';
}
function activateCustomPlan(plan){
 if(Object.values(data.sessions).some(s=>!s.finished)&&!confirm('You have an unfinished workout. Start the custom plan anyway? Existing workouts will remain in history.'))return;
 if(!confirm('Activate this program on this device? Your previous workout history will remain saved.'))return;
 const old=data.program;old.history.push({number:old.number,index:old.index,started:old.started,ended:new Date().toISOString()});
 old.number+=1;old.started=new Date().toISOString();data.customPlan=plan;data.schedule={};selectedSlot=null;day=0;editing=null;save();tab='home';render();toast('Personalized program active');
}
function saveBuilder(){
 const title=document.getElementById('plan-title').value.trim(),days=Number(document.getElementById('plan-days').value);
 if(!title||title.length>65)return alert('Enter a program name.');
 const entries=[];
 for(let i=0;i<days;i++){
  const raw=document.getElementById('manual-'+i).value.trim().split('\n').filter(Boolean);if(!raw.length||raw.length>12)return alert('Workout '+String.fromCharCode(65+i)+' needs 1 to 12 exercises.');
  const moves=[];
  for(const line of raw){const parts=line.split('|').map(x=>x.trim()),n=parts[0],count=Number(parts[1]),reps=parts[2];if(parts.length!==3||!n||n.length>90||!Number.isInteger(count)||count<1||count>10||!reps||reps.length>30)return alert('Check workout '+String.fromCharCode(65+i)+' line: '+line+'. Use Name | sets | reps.');
   moves.push(X(n,count,reps));}
  entries.push(['Workout '+String.fromCharCode(65+i),moves]);
 }
 activateCustomPlan({label:title,focus:'Custom '+days+'-day training plan',days:entries});
}
function settings(){return header(`<h1>Settings & backup</h1><p class="sub">Choose your preferred unit and keep a copy of your history.</p>`)+planBuilder()+`<section class="card"><h2>Weight units</h2><label class="input-label" for="unit">How do you track lifting weight?</label><select id="unit"><option value="lb" ${data.unit==='lb'?'selected':''}>Pounds (lb)</option><option value="kg" ${data.unit==='kg'?'selected':''}>Kilograms (kg)</option></select><p class="note">Changing the label does not convert numbers you previously entered.</p></section><section class="card"><h2>Weekly workout days</h2><p class="muted">Choose three different weekdays for workouts A, B and C. Changes update the calendar; individually moved or skipped sessions retain their original schedule entries only while those entries still exist.</p>${[0,1,2].map(i=>`<label class="input-label" for="weekday-${i}">Workout ${'ABC'[i]}</label><select id="weekday-${i}" data-weekday="${i}">${weekdayNames.map((n,v)=>`<option value="${v}" ${data.weekdays[i]===v?'selected':''}>${n}</option>`).join('')}</select>`).join('')}</section><section class="card"><h2>Program control</h2><p class="muted">Current: Program ${data.program.number} — ${esc(cycleFor(month).label)}. It stays active until you manually start the next one.</p>${button('Start next program →','advance','secondary')}<p class="note">Previous programs stay in workout history. You can advance anytime; there is no deadline.</p></section><section class="card"><h2>Your data</h2><p class="muted">Workouts save automatically in this browser using local storage, not in a cloud account. Keep periodic backup files, especially before clearing browser data or changing phones.</p><div class="stack">${button('Export backup (.json)','export','secondary')}<label class="btn secondary" style="text-align:center;cursor:pointer">Import backup (.json)<input id="import" class="hide" type="file" accept=".json,application/json"></label></div></section><section class="card"><h2>Previous weights & progression</h2><p class="muted">Lift Journal compares the same exercise name across your completed workout history, including earlier programs. Only checked sets with reps and weights count. If all prescribed sets reached the top of the current rep range at the same weight, it may suggest a small increase. Otherwise it recommends holding or building reps first.</p><p class="note">Recommendations are guidelines, not automatic weight changes. Prioritize technique and comfort. New sessions save their weight unit; older entries may not identify whether you originally logged pounds or kilograms.</p></section><section class="card"><h2>Training guidance</h2><p class="muted">Start each workout with 5–10 minutes of easy movement and warm-up sets. Pick weights that let you finish with ~1–3 good reps left in reserve. When you reach the top of the target range for all sets, increase weight a little next time. Rest 1–2 minutes for accessory lifts and about 2–3 minutes for heavier compound lifts.</p><p class="muted">For single-leg or single-arm exercises, complete the prescribed reps on each side. Your program only changes when you choose Start next program. Four templates rotate in order, and workouts remain in your history. No equipment beyond your listed gym setup is required.</p></section><section class="card"><h2>Reset</h2><p class="note">This permanently clears locally saved workouts unless you have exported a backup.</p>${button('Delete all saved workouts','clear','danger')}</section>`}
function render(){if(day>=cycleFor(month).days.length)day=0;if(editing&&data.sessions[editing])tab='train';el.innerHTML=({home,train,history,settings}[tab])();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('selected',b.dataset.tab===tab))}
document.addEventListener('click',e=>{const t=e.target.closest('[data-movement],[data-tab],[data-action],[data-day],[data-open],[data-slot],[data-skip],[data-calendar-date]');if(!t)return;if(t.dataset.movement){changeMovement(Number(t.dataset.index),t.dataset.movement);return}if(t.dataset.tab){editing=null;tab=t.dataset.tab;render();scrollTo(0,0);return}if(t.dataset.day!==undefined){day=Number(t.dataset.day);selectedSlot=null;render();return}if(t.dataset.calendarDate){const match=monthSchedule().find(a=>a.date===t.dataset.calendarDate);if(match){selectedSlot=match.slot;day=match.day;render();document.querySelector('.move-panel')?.scrollIntoView({block:'nearest'});}return}if(t.dataset.slot){selectedSlot=t.dataset.slot;day=Number(t.dataset.planDay);render();return}if(t.dataset.skip){const key=t.dataset.skip,old=data.schedule[key]||{};data.schedule[key]={...old,status:old.status==='skipped'?'planned':'skipped'};if(selectedSlot===key)selectedSlot=null;save();render();return}if(t.dataset.open){editing=t.dataset.open;tab='train';render();scrollTo(0,0);return}switch(t.dataset.action){case'move':{if(!selectedSlot)return;const v=document.getElementById('move-date')?.value;if(!v||!v.startsWith(month+'-')){alert('Choose a date in this month.');return}const old=data.schedule[selectedSlot]||{};data.schedule[selectedSlot]={...old,date:v,status:'planned'};save();selectedSlot=null;render();toast('Workout moved');break}case'advance':startNextProgram();break;case'generate':{const goal=document.getElementById('gen-goal').value,days=Number(document.getElementById('gen-days').value),eq=document.getElementById('gen-equipment').value;activateCustomPlan(generatedRoutine(goal,days,eq));break}case'save-plan':saveBuilder();break;case'prev':selectedSlot=null;shiftMonth(-1);break;case'next':selectedSlot=null;shiftMonth(1);break;case'start':if(findActive()&&!confirm('You have an unfinished workout. Start another one?'))return;newSession();scrollTo(0,0);break;case'resume':editing=findActive()?.key;render();break;case'back':editing=null;tab='train';render();break;case'finish':finish();scrollTo(0,0);break;case'history':editing=null;tab='history';render();break;case'export':{const blob=new Blob([JSON.stringify({format:'lift-journal-v1',exported:new Date().toISOString(),data},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lift-journal-backup-'+isoDate(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);break}case'clear':if(confirm('Delete ALL workouts saved on this browser? This cannot be undone.')){data.sessions={};data.schedule={};data.program={index:0,number:1,started:new Date().toISOString(),history:[]};save();editing=null;render();toast('Local workout history cleared')}break}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-calendar-date]')){e.preventDefault();e.target.click()}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='unit'){data.unit=t.value;save();return}if(t.id==='plan-days'){document.querySelectorAll('[data-builder-day]').forEach((el,i)=>el.hidden=i>=Number(t.value));return}if(t.dataset.weekday!==undefined){let i=Number(t.dataset.weekday),v=Number(t.value);if(data.weekdays.some((d,j)=>j!==i&&d===v)){alert('Choose a different weekday for each workout.');render();return}data.weekdays[i]=v;save();render();return}if(t.dataset.field){const s=data.sessions[editing],v=s?.exercises[Number(t.dataset.ex)]?.sets[Number(t.dataset.set)];if(!v||s.finished)return;v[t.dataset.field]=t.dataset.field==='done'?t.checked:t.value;save();if(t.dataset.field==='done'){const active=s.exercises.filter(x=>!x.skipped),completed=active.flatMap(x=>x.sets).filter(x=>x.done).length,total=active.flatMap(x=>x.sets).length;const p=document.querySelector('.progress>div');if(p)p.style.width=(100*completed/total)+'%'}}});
document.addEventListener('change',async e=>{if(e.target.id!=='import')return;let f=e.target.files[0];if(!f)return;try{let incoming=JSON.parse(await f.text()),obj=incoming.data||incoming;if(!obj.sessions||typeof obj.sessions!=='object'||Array.isArray(obj.sessions)||!['kg','lb'].includes(obj.unit))throw Error('Invalid file');if(!confirm('Replace all currently saved workouts with this backup?'))return;data={sessions:obj.sessions,unit:obj.unit,weekdays:Array.isArray(obj.weekdays)&&obj.weekdays.length===3?obj.weekdays:[1,3,5],schedule:obj.schedule||{},program:obj.program&&Number.isInteger(obj.program.index)?obj.program:{index:0,number:1,started:new Date().toISOString(),history:[]},customPlan:obj.customPlan||null};if(!Array.isArray(data.program.history))data.program.history=[];save();editing=null;tab='history';render();toast('Backup restored')}catch(err){alert('Cannot import backup: '+err.message)}e.target.value=''});
render();
})();
</script></body></html>
