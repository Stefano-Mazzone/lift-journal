ck;color:var(--muted);font-size:12px;margin:13px 0 6px}select{width:100%;background:var(--surface2);color:var(--text);padding:12px;border:1px solid var(--line);border-radius:10px}.hide{display:none!important}.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:var(--accent);color:#10231c;padding:11px 16px;border-radius:12px;font-weight:800;z-index:30;box-shadow:0 7px 30px #0008;max-width:90vw;white-space:nowrap}.week{font-size:12px;color:var(--muted)}.progress{height:7px;border-radius:20px;background:#31404a;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:var(--accent);transition:width .2s}.restore{width:100%;padding:10px;border:1px dashed var(--line);border-radius:12px}.right{text-align:right}.schedule-row{display:flex;justify-content:space-between;gap:8px;align-items:center;border-top:1px solid var(--line);padding:12px 0}.schedule-row .row{gap:5px}.move-panel{border:1px solid #47735e;border-radius:12px;padding:13px;margin-top:10px;background:#19332c}.move-panel input{width:100%;background:var(--surface2);color:var(--text);padding:12px;border:1px solid var(--line);border-radius:10px}@media(max-width:420px){.schedule-row{align-items:flex-start}.schedule-row .btn{padding:7px 8px}}.calendar-legend{display:flex;flex-wrap:wrap;gap:9px 14px;margin:13px 0;font-size:12px;color:var(--muted)}.legend-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:#9dc8ff}.legend-dot.completed{background:#83e6b6}.legend-dot.skipped{background:#ff9b9b}.legend-dot.progress{background:#f1cc83}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:12px 0 18px}.calendar-weekday{text-align:center;font-size:11px;color:var(--muted);padding:5px 0}.calendar-cell{min-height:64px;border:1px solid #303b4d;border-radius:10px;background:#121a27;padding:6px 3px;color:var(--text);text-align:left;min-width:0}.calendar-cell.blank{border:0;background:transparent}.calendar-cell.today{border /* Discoverable, swipeable bottom navigation */
body{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
.nav-dock{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;gap:4px;padding:10px max(8px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));background:#111924f2;backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:10;isolation:isolate}

.nav-dock.has-next::after{right:55px;background:linear-gradient(to right,transparent,#111924f2)}

.food-quick-search{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px}.food-quick-search .btn{padding:7px 10px;font-size:12px}.movement-list{max-height:350px;overflow-y:auto;overscroll-behavior:contain;padding-right:3px}</style></head><body><main class="shell" id="app"></main><div class="nav-dock" id="nav-dock"><button type="button" class="nav-arrow is-hidden" id="nav-prev" aria-label="Scroll to previous menu tabs"><span aria-hidden="true">‹</span><small>Back</small></button><div class="nav-scroll" id="nav-scroll"><nav class="tabs" id="nav" aria-label="Lift Journal sections"><button data-tab="home">⌂<br>Plan</button><button data-tab="train">▣<br>Train</button><button data-tab="history">◷<br>History</button><button data-tab="movements">↗<br>Movements</button><button data-tab="calories">◉<br>Calories</button><button data-tab="gyms">⌖<br>Gyms</button><button data-tab="settings">⚙<br>Settings</button></nav></div><button type="button" class="nav-arrow" id="nav-next" aria-label="Scroll to more menu tabs"><span aria-hidden="true">›</span><small>More</small></button></div><script>
(()=>{'use strict';
const KEY='lift-journal-v1',names=['January','February','March','April','May','June','July','August','September','October','November','December'];
// Program changes are manual. Each program repeats A/B/C until the user advances.
const X=(name,sets,reps,rest=90)=>({name,sets,reps,rest});
const cycles=[
{label:'Foundation',focus:'Build consistency and technique',days:[['Full Body A',[X('Pendulum Squat',3,'8–10',120),X('Dumbbell Bench Press',3,'8–12'),X('Lat Pulldown',3,'10–12'),X('Leg Curl Machine',3,'10–15'),X('Cable Triceps Pushdown',2,'12–15')]],['Full Body B',[X('Dumbbell Romanian Deadlift',3,'8–10',120),X('Seated Cable Row',3,'10–12'),X('Incline Dumbbell Press',3,'8–12'),X('Dumbbell Lateral Raise',3,'12–15'),X('Dumbbell Curl',2,'10–12')]],['Full Body C',[X('Pendulum Squat',3,'10–12',120),X('Flat Bench Press',3,'6–10',120),X('Neutral-Grip Lat Pulldown',3,'8–12'),X('Cable Face Pull',3,'12–15'),X('Standing Dumbbell Calf Raise',3,'12–20')]]]},
{label:'Strength Builder',focus:'Progress the main lifts',days:[['Strength A',[X('Flat Bench Press',4,'5–8',150),X('Pendulum Squat',3,'6–8',150),X('Seated Cable Row',3,'8–10'),X('Leg Curl Machine',3,'10–12'),X('Cable Crunch',3,'12–15')]],['Strength B',[X('Dumbbell Romanian Deadlift',4,'6–8',150),X('Lat Pulldown',4,'8–10'),X('Seated Dumbbell Shoulder Press',3,'8–10'),X('Cable Triceps Pushdown',3,'10–12'),X('Dumbbell Curl',3,'10–12')]],['Strength C',[X('Pendulum Squat',4,'6–8',150),X('Incline Dumbbell Bench Press',4,'8–10'),X('One-Arm Cable Row',3,'10–12 / side'),X('Dumbbell Lateral Raise',3,'12–15'),X('Standing Dumbbell Calf Raise',3,'12–15')]]]},
{label:'Hypertrophy Mix',focus:'More volume and exercise variety',days:[['Build A',[X('Pendulum Squat',4,'10–12',120),X('Incline Dumbbell Bench Press',3,'10–12'),X('Wide-Grip Lat Pulldown',3,'10–12'),X('Leg Curl Machine',3,'12–15'),X('Cable Lateral Raise',3,'12–15')]],['Build B',[X('Dumbbell Romanian Deadlift',3,'10–12',120),X('Close-Grip Seated Cable Row',4,'10–12'),X('Flat Dumbbell Bench Press',3,'10–12'),X('Rope Triceps Pushdown',3,'12–15'),X('Hammer Curl',3,'10–15')]],['Build C',[X('Dumbbell Split Squat',3,'10 / side',120),X('Flat Bench Press',3,'8–10'),X('Underhand Lat Pulldown',3,'10–12'),X('Cable Face Pull',3,'15–20'),X('Cable Crunch',3,'12–15')]]]},
{label:'Balanced Progress',focus:'Keep developing strength and control',days:[['Progress A',[X('Pendulum Squat',3,'8–10',120),X('Flat Dumbbell Bench Press',4,'8–10'),X('Seated Cable Row',3,'8–12'),X('Leg Curl Machine',3,'12–15'),X('Dumbbell Lateral Raise',2,'15–20')]],['Progress B',[X('Dumbbell Romanian Deadlift',3,'8–10',120),X('Neutral-Grip Lat Pulldown',4,'8–10'),X('Seated Dumbbell Shoulder Press',3,'8–12'),X('Cable Biceps Curl',3,'10–15'),X('Rope Triceps Pushdown',3,'10–15')]],['Progress C',[X('Dumbbell Reverse Lunge',3,'10 / side',120),X('Incline Dumbbell Bench Press',3,'8–12'),X('One-Arm Dumbbell Row',3,'10 / side'),X('Cable Face Pull',3,'12–20'),X('Standing Dumbbell Calf Raise',3,'15–20')]]]}];
const today=new Date(),initialMonth=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0');
const blank=()=>({sessions:{},unit:'lb',weekdays:[1,3,5],schedule:{},program:{index:0,number:1,started:new Date().toISOString(),history:[]}});let data;try{data=JSON.parse(localStorage.getItem(KEY))||blank();if(!data.sessions||!['kg','lb'].includes(data.unit))throw 0}catch{data=blank()}
if(!Array.isArray(data.weekdays)||data.weekdays.length!==3)data.weekdays=[1,3,5];if(!data.schedule||typeof data.schedule!=='object')data.schedule={};if(!data.program||!Number.isInteger(data.program.index)){data.program={index:0,number:1,started:new Date().toISOString(),history:[]};}if(!Array.isArray(data.program.history))data.program.history=[];if(data.customPlan&&!Array.isArray(data.customPlan.days))data.customPlan=null;let month=initialMonth,tab='home',day=0,editing=null,selectedSlot=null;const el=document.getElementById('app');
function save(){localStorage.setItem(KEY,JSON.stringify(data))}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cycleFor(m){return data.customPlan||cycles[data.program.index%cycles.length]}
function cycleForSession(s){if(s.planSnapshot)return s.planSnapshot;if(Number.isInteger(s.cycleIndex))return cycles[s.cycleIndex%cycles.length];const [y,mo]=s.month.split('-').map(Number);return cycles[(y*12+mo-1)%cycles.length]}

function labelMonth(m){let [y,mo]=m.split('-').map(Number);return names[mo-1]+' '+y}function shiftMonth(d){let [y,mo]=month.split('-').map(Number);const x=new Date(y,mo-1+d,1);month=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');editing=null;render()}

function pastExercise(name,before){

 for(const s of ss){const e=(Array.isArray(s.exercises)?s.exercises:[]).find(x=>x.name===name);if(!e||!Array.isArray(e.sets))continue;

function repGoal(reps){const nums=String(reps).match(/\d+/g);if(!nums)return null;const min=Number(nums[0]),max=nums.length>1&&/[–-]/.test(String(reps))?Number(nums[1]):min;return {min,max}}

function adviceFor(ex,last){
 if(!last)return {kind:'unknown',title:'No previous weights yet',details:'Log and complete a workout to get a comparison next time.'};
 if(last.unit!==data.unit)return {kind:'unknown',title:'Check your weight units',details:'Your last session used '+last.unit+', but Settings currently shows '+data.unit+'. Units are not automatically converted, so no increase is suggested.'};
 const goal=repGoal(ex.reps);if(!goal)return {kind:'unknown',title:'Review your last workout',details:'There is no clear rep target for this exercise.'};
 if(last.sets.length<ex.sets)return {kind:'hold',title:'Build a complete baseline',details:'Last time, only '+last.sets.length+' of '+ex.sets+' prescribed sets had checked reps and weights. Complete all sets before increasing.'};
 const working=last.sets.slice(0,ex.sets);
 if(working.some(v=>v.reps<goal.min))return {kind:'caution',title:'Build reps first',details:'At least one set was below '+goal.min+' reps. Keep or reduce weight as needed to hit the range with good form.'};
 if(working.some(v=>v.reps<goal.max))return {kind:'hold',title:'Keep the weight for now',details:'Aim for '+goal.max+' reps on all '+ex.sets+' sets with good form before increasing.'};
 const w=working[0].weight;

 return {kind:'increase',title:'Small increase may be appropriate',details:'You reached at least '+goal.max+' reps on all '+ex.sets+' sets at '+formatWeight(w)+' '+last.unit+'. If your form was controlled and you had 1–3 reps in reserve, try roughly 2.5–5% more next time if available.'};
}

function changeMovement(i,cmd){

  if(answer===null)return;

  if(!name||name.length>90){alert('Enter an exercise name up to 90 characters.');return}
  if(e.name!==name){if(!e.originalName)e.originalName=e.name;e.name=name;e.skipped=false}

  if(e.originalName){e.name=e.originalName;delete e.originalName;e.skipped=false}

/* A set with numeric reps and weight is an actual logged set, even if the user
   didn't tick Done. That checkbox remains useful for workout progress.
   In-progress sessions are included in charts but labelled provisional. */
function validWeightRep(set){
 if(!set)return null;
 const weight=loggedNumber(set.weight),reps=loggedNumber(set.reps);
 if(weight===null||reps===null||reps<=0)return null;
 return {weight,reps,done:!!set.done};
}
function workoutWeightLogs(s){
 if(!s||!Array.isArray(s.exercises))return [];
 const logs=[];
 for(const exercise of s.exercises){
  if(!exercise||exercise.skipped||!Array.isArray(exercise.sets))continue;
  for(const set of exercise.sets){
   const entry=validWeightRep(set);
   if(entry)logs.push({name:String(exercise.name||'Unnamed exercise').trim(),...entry});
  }
 }
 return logs;
}
function tonnageRecords(){
 const records=[];
 for(const s of Object.values(data.sessions)){
  const logs=workoutWeightLogs(s);
  if(!logs.length)continue;
  const date=s.finished||s.started||new Date().toISOString();
  const total=logs.reduce((sum,entry)=>sum+entry.weight*entry.reps,0);
  records.push({date,unit:s.unit||data.unit,total,sets:logs.length,provisional:!s.finished});
 }
 return records.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
}
function tonnageKey(date,period){
 const d=new Date(date);
 if(period==='session')return date;
 if(period==='month')return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
 const monday=new Date(d.getFullYear(),d.getMonth(),d.getDate());
 monday.setDate(monday.getDate()-(monday.getDay()+6)%7);
 return isoDate(monday);
}
function tonnagePlot(entries,unit,period){

 const grouped=new Map();
 for(const e of entries){const k=tonnageKey(e.date,period);grouped.set(k,(grouped.get(k)||0)+e.total)}
 const rows=[...grouped].sort((a,b)=>a[0].localeCompare(b[0])).slice(-12);
 const max=Math.max(1,...rows.map(x=>x[1])),count=rows.length;
 const width=360,height=200,left=38,right=8,top=15,bottom=44,inner=width-left-right,usable=height-top-bottom;
 const step=inner/count,barW=Math.min(26,step*.68),bars=rows.map(([key,val],i)=>{
  const x=left+step*i+(step-barW)/2,y=top+usable*(1-val/max),barH=Math.max(1,top+usable-y);
  const label=period==='session'?new Date(key).toLocaleDateString(undefined,{month:'numeric',day:'numeric'}):period==='month'?key.slice(5)+'/'+key.slice(2,4):key.slice(5);
  return '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+barH.toFixed(1)+'" rx="3" fill="#83e6b6"><title>'+esc(key)+': '+formatWeight(val)+' '+esc(unit)+'</title></rect><text x="'+(x+barW/2).toFixed(1)+'" y="'+(height-24)+'" text-anchor="middle" font-size="9" fill="#b0c1d0">'+esc(label)+'</text>';
 }).join('');
 const guides=[0,.5,1].map(f=>{const y=top+usable*(1-f);return '<line x1="'+left+'" x2="'+(width-right)+'" y1="'+y+'" y2="'+y+'" stroke="#35465a"/><text x="'+(left-5)+'" y="'+(y+3)+'" fill="#b0c1d0" font-size="9" text-anchor="end">'+esc(formatWeight(max*f))+'</text>'}).join('');

}
function tonnageView(){

function recordedMovements(){

  const date=s.finished||s.started||new Date().toISOString(),unit=s.unit||data.unit;
  for(const exercise of s.exercises){
   if(!exercise||exercise.skipped||!Array.isArray(exercise.sets))continue;
   const sets=exercise.sets.map(validWeightRep).filter(Boolean);

   const name=String(exercise.name||'Unnamed exercise').trim();

   if(!byName.has(key))byName.set(key,{name,unit,entries:[]});

    sets:sets.length,reps:sets.map(v=>v.reps),provisional:!s.finished
   });

function matchFood(food,query){

async function findFoods(q){

  const products=foodCache.get(queryKey);

  }

 }catch(e){

}

function gymDistance(lat1,lon1,lat2,lon2){
 const d=Math.PI/180,a=Math.sin((lat2-lat1)*d/2)**2+Math.cos(lat1*d)*Math.cos(lat2*d)*Math.sin((lon2-lon1)*d/2)**2;
 return 12742*Math.asin(Math.sqrt(a));
}

async function gymOverpassQuery(query){
 // The original overpass.kumi.systems address was retired.
 // GET works with browser CORS without requiring POST redirects/preflights.
 const servers=['https://overpass.private.coffee/api/interpreter','https://overpass-api.de/api/interpreter','https://overpass.osm.jp/api/interpreter'];
 let lastError='connection failed';
 for(let i=0;i<servers.length;i++){
  if(i>0){
   const status=document.getElementById('gym-status');
   if(status)status.textContent='Trying backup gym listings server '+(i+1)+' of '+servers.length+'…';
  }
  const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),i===0?14000:11000);
  try{
   const response=await fetch(servers[i]+'?data='+encodeURIComponent(query),{method:'GET',cache:'no-store',signal:controller.signal});
   if(!response.ok)throw Error('HTTP '+response.status);
   const payload=await response.json();
   if(!payload||!Array.isArray(payload.elements))throw Error('No usable results received');
   if(typeof payload.remark==='string'&&/timeout|quota|error|out of memory|limit/i.test(payload.remark))throw Error(payload.remark);
   return payload;
  }catch(err){lastError=err?.name==='AbortError'?'request timed out':String(err?.message||'connection failed')}
  finally{clearTimeout(timeout)}
 }
 throw Error(lastError);
}
async function gymSearch(lat,lon){
 if(!Number.isFinite(lat)||!Number.isFinite(lon)){gymBusy=false;gymMessage='Valid location coordinates were not available.';render();return}
 gymCoordinates={lat,lon};gymBusy=true;gymResults=[];gymMessage='Looking for nearby gyms…';render();
 const radius=Math.max(500,Math.min(20000,Number(gymRadius)||5000));
 const query='[out:json][timeout:25];(nwr["leisure"="fitness_centre"](around:'+radius+','+lat+','+lon+');nwr["sport"="fitness"](around:'+radius+','+lat+','+lon+'););out center 90;';
 try{
  const payload=await gymOverpassQuery(query),seen=new Set();
  gymResults=payload.elements.map(x=>{
   const tags=x.tags||{},a=Number(x.lat??x.center?.lat),b=Number(x.lon??x.center?.lon);
   if(!Number.isFinite(a)||!Number.isFinite(b))return null;
   const name=String(tags.name||tags.brand||'Unnamed fitness centre'),key=name.toLowerCase()+'|'+a.toFixed(4)+'|'+b.toFixed(4);
   if(seen.has(key))return null;
   seen.add(key);
   const street=[tags['addr:housenumber'],tags['addr:street']].filter(Boolean).join(' ');
   const address=[street,tags['addr:city']].filter(Boolean).join(', ');
   return {name,lat:a,lon:b,address,distance:gymDistance(lat,lon,a,b)};
  }).filter(Boolean).sort((a,b)=>a.distance-b.distance).slice(0,40);
  gymMessage=gymResults.length?'Found '+gymResults.length+' nearby gyms. Open directions in Apple Maps or Google Maps.':
   'No gyms listed within '+(radius/1000)+' km. Try a wider radius or search directly in Maps.';
 }catch(err){
  gymMessage='Public gym listings are unavailable right now ('+(err?.message||'connection error')+'). Your location was detected; use Apple Maps or Google Maps below.';
 }
 gymBusy=false;render();
}
function gymNear(){

 if(gymBusy){show('A gym search is already running.');return}
 show('Requesting your iPhone location…');
 if(!window.isSecureContext||!navigator.geolocation){show('Location is unavailable in this browser. Open the HTTPS site in Safari or use Apple Maps / Google Maps.');return}
 gymBusy=true;
 try{
  navigator.geolocation.getCurrentPosition(
   p=>{

    gymSearch(p.coords.latitude,p.coords.longitude)
   },
   err=>{
    gymBusy=false;
    const reason=err.code===1?'Location permission was denied. Check iPhone Location Services and Safari Websites permissions.':err.code===2?'Your phone could not determine its location. Check GPS and Wi-Fi.':err.code===3?'Location timed out. Try again with better reception.':'Your location was not available.';
    show(reason+' You can still open Apple Maps, Google Maps, or search by city.');
   },
   {enableHighAccuracy:false,timeout:15000,maximumAge:0}

}

function compareAppVersions(a,b){
 const left=a.split('.').map(Number),right=b.split('.').map(Number);
 if(left.some(v=>!Number.isFinite(v))||right.some(v=>!Number.isFinite(v)))return null;
 for(let i=0;i<Math.max(left.length,right.length);i++){if((left[i]||0)>(right[i]||0))return 1;if((left[i]||0)<(right[i]||0))return -1}return 0;

  const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),12000);
  let response;

  const comparison=compareAppVersions(latestVersion,APP_VERSION);
  nextStatus=comparison===0?'Your app is up to date.':comparison===null?'Check complete. Compare the version numbers.':comparison>0?'A newer version is available. Tap Reload app.':'Your app is newer than published metadata; deployment may still be finishing.';

}
